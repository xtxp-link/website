<!doctype html>
<html><head><meta charset="utf-8">
<!-- Link-preview card, 1200x630. Centred on the logo's red +, per the brand guide
     (the logo uses the plus-centred viewBox, HERO_VIEWBOX in src/brand/logo.mjs).
     Everything sits in the centre 630x630 square,
     because Slack crops the image to a centred square thumbnail while WhatsApp and
     others show it whole. Render with scripts/social/render.mjs. -->
<style>
  html,body{margin:0;width:1200px;height:630px;background:#11151f;color:#eceff7;
    font-family:"Inter","Helvetica Neue",Arial,sans-serif;}
  .wrap{box-sizing:border-box;width:1200px;height:630px;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(520px 420px at 50% 40%, rgba(255,84,54,.14), transparent 72%);}
  .col{width:610px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:34px}
  .logo svg{width:610px;height:auto;display:block}
  h1{font-size:58px;line-height:1.08;margin:0;font-weight:700;letter-spacing:-.01em}
  .url{font-size:30px;color:#ff5436;font-weight:600}
</style></head>
<body><div class="wrap"><div class="col">
  <div class="logo"><svg xmlns="http://www.w3.org/2000/svg" class="xtxp-logo" viewBox="-64 -20 192 54" role="img" aria-label="XTXP"><style>.xtxp-logo{--xl-x:#eceff7;--xl-t:#ff5436;--xl-p:#7d7d83}.xtxp-logo .xl-l,.xtxp-logo .xl-r{stroke:var(--xl-x)}.xtxp-logo .xl-c{stroke:var(--xl-t)}.xtxp-logo .xl-p{stroke:var(--xl-p)}.xtxp-logo .xl-ol,.xtxp-logo .xl-p{stroke-dasharray:1 2}</style><g fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"><path class="xl-c" d="M-14 -14L14 14M14 -14L-14 14" stroke-width="9.9" transform="translate(32 0) rotate(45) scale(.606)"/><g class="xl-l"><path d="M14 -14L0 0L14 14"/><path class="xl-ol" pathLength="1" d="M0 0L-14 -14"/><path class="xl-ol" pathLength="1" d="M0 0L-14 14"/></g><g class="xl-r" transform="translate(64 0)"><path d="M-14 -14L0 0L-14 14"/><path class="xl-ol" pathLength="1" d="M0 0L14 -14"/><path class="xl-ol" pathLength="1" d="M0 0L14 14"/></g><path class="xl-p" pathLength="1" d="M0 -14V28M0 0A14 14 0 1 1 28 0A14 14 0 1 1 0 0" transform="translate(92 0)"/></g></svg>
</div>
  <h1>The XML to<br>XML Protocol</h1>
  <div class="url">xtxp.link</div>
</div></div></body></html>
