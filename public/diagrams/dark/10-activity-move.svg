<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="ACTIVITY" height="1048px" preserveAspectRatio="none" style="width:489px;height:1048px;" version="1.1" viewBox="0 0 489 1048" width="489px" zoomAndPan="magnify"><title>Later: cycle-safe tree moves (after Evan Wallace)</title><defs/><g><g class="title" data-source-line="2"><text fill="#E6E6E8" font-family="Helvetica" font-size="16" font-weight="bold" lengthAdjust="spacing" textLength="387.2031" x="49.4139" y="35.5">Later: cycle-safe tree moves (after Evan Wallace)</text></g><rect fill="none" height="285.6475" rx="4" ry="4" style="stroke:#5A5A60;stroke-width:1.5;" width="303.7578" x="32.5769" y="51.3594"/><path d="M135.1638,51.3594 L135.1638,60.0889 L125.1638,70.0889 L32.5769,70.0889" fill="none" style="stroke:#5A5A60;stroke-width:1.5;"/><text fill="#E6E6E8" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="92.5869" x="35.5769" y="64.9531">Writing a move</text><ellipse cx="184.4558" cy="90.0889" fill="#E6E6E8" rx="10" ry="10" style="stroke:#8F8F95;stroke-width:1;"/><rect fill="#232326" height="35.7295" rx="4" ry="4" style="stroke:#5A5A60;stroke-width:0.5;" width="229.5044" x="69.7036" y="120.0889"/><text fill="#E6E6E8" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="209.5044" x="79.7036" y="142.6826">move(node, new_parent, position)</text><rect fill="#232326" height="35.7295" rx="4" ry="4" style="stroke:#5A5A60;stroke-width:0.5;" width="230.355" x="69.2783" y="175.8184"/><text fill="#E6E6E8" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="210.355" x="79.2783" y="198.4121">c = highest counter in node.edges</text><rect fill="#232326" height="51.459" rx="4" ry="4" style="stroke:#5A5A60;stroke-width:0.5;" width="283.7578" x="42.5769" y="231.5479"/><text fill="#E6E6E8" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="263.7578" x="52.5769" y="254.1416">node.edges[new_parent] = (c + 1, position)</text><text fill="#E6E6E8" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="211.6182" x="52.5769" y="269.8711">(a plain map write; old edges stay)</text><ellipse cx="184.4558" cy="314.0068" fill="none" rx="11" ry="11" style="stroke:#8F8F95;stroke-width:1;"/><ellipse cx="184.4558" cy="314.0068" fill="#222222" rx="6" ry="6" style="stroke:#8F8F95;stroke-width:1;"/><rect fill="none" height="690.4443" rx="4" ry="4" style="stroke:#5A5A60;stroke-width:1.5;" width="467.031" x="11" y="347.0068"/><path d="M269.1108,347.0068 L269.1108,355.7363 L259.1108,365.7363 L11,365.7363" fill="none" style="stroke:#5A5A60;stroke-width:1.5;"/><text fill="#E6E6E8" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="248.1108" x="14" y="360.6006">Reading the tree (every peer, same rule)</text><ellipse cx="184.4558" cy="385.7363" fill="#E6E6E8" rx="10" ry="10" style="stroke:#8F8F95;stroke-width:1;"/><rect fill="#232326" height="51.459" rx="4" ry="4" style="stroke:#5A5A60;stroke-width:0.5;" width="197.2202" x="85.8457" y="415.7363"/><text fill="#E6E6E8" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="177.2202" x="95.8457" y="438.3301">best edge = highest counter,</text><text fill="#E6E6E8" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="165.6548" x="95.8457" y="454.0596">then lowest parent node ID</text><rect fill="#232326" height="51.459" rx="4" ry="4" style="stroke:#5A5A60;stroke-width:0.5;" width="242.498" x="63.2068" y="487.1953"/><text fill="#E6E6E8" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="185.396" x="73.2068" y="509.7891">follow each node's best edge;</text><text fill="#E6E6E8" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="222.498" x="73.2068" y="525.5186">nodes that reach the root are rooted</text><rect fill="#232326" height="67.1885" rx="4" ry="4" style="stroke:#5A5A60;stroke-width:0.5;" width="290.9116" x="39" y="623.2383"/><text fill="#E6E6E8" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="270.9116" x="49" y="645.832">in ascending node ID order (client, counter):</text><text fill="#E6E6E8" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="156.5713" x="49" y="661.5615">root each at its best edge</text><text fill="#E6E6E8" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="171.2534" x="49" y="677.291">whose parent is now rooted</text><rect fill="#232326" height="51.459" rx="4" ry="4" style="stroke:#5A5A60;stroke-width:0.5;" width="226.4004" x="71.2556" y="710.4268"/><text fill="#E6E6E8" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="206.4004" x="81.2556" y="733.0205">then root nodes whose best edge</text><text fill="#E6E6E8" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="178.1216" x="81.2556" y="748.75">leads to a newly rooted node</text><polygon fill="#3D1B15" points="115.5647,558.6543,253.3469,558.6543,265.3469,574.3838,253.3469,590.1133,115.5647,590.1133,103.5647,574.3838,115.5647,558.6543" style="stroke:#FF6A4D;stroke-width:0.5;"/><text fill="#A0A0A6" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="20.0742" x="188.4558" y="601.7383">yes</text><text fill="#E6E6E8" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="137.7822" x="115.5647" y="571.248">any nodes not rooted?</text><text fill="#E6E6E8" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="117.6284" x="115.5647" y="586.9775">(they are in cycles)</text><text fill="#A0A0A6" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="14.2852" x="89.2795" y="571.4893">no</text><rect fill="#232326" height="51.459" rx="4" ry="4" style="stroke:#5A5A60;stroke-width:0.5;" width="200.6987" x="84.1064" y="803.8857"/><text fill="#E6E6E8" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="180.6987" x="94.1064" y="826.4795">order children by the position</text><text fill="#E6E6E8" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="130.127" x="94.1064" y="842.209">on their chosen edge</text><rect fill="#232326" height="51.459" rx="4" ry="4" style="stroke:#5A5A60;stroke-width:0.5;" width="186.0229" x="91.4443" y="875.3447"/><text fill="#E6E6E8" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="117.6221" x="101.4443" y="897.9385">hide deleted nodes</text><text fill="#E6E6E8" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="166.0229" x="101.4443" y="913.668">and everything under them</text><path d="M215.4558,936.8037 L215.4558,977.1274 L195.4558,981.1274 L215.4558,985.1274 L215.4558,1025.4512 A0,0 0 0 0 215.4558,1025.4512 L468.031,1025.4512 A0,0 0 0 0 468.031,1025.4512 L468.031,946.8037 L458.031,936.8037 L215.4558,936.8037 A0,0 0 0 0 215.4558,936.8037" fill="#2F2A1C" style="stroke:#5A5A60;stroke-width:0.5;"/><path d="M458.031,936.8037 L458.031,946.8037 L468.031,946.8037 L458.031,936.8037" fill="#2F2A1C" style="stroke:#5A5A60;stroke-width:0.5;"/><text fill="#E6E6E8" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="231.5752" x="221.4558" y="954.3975">Always ends: every node's first edge,</text><text fill="#E6E6E8" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="228.0522" x="221.4558" y="970.127">from when it was created, points to a</text><text fill="#E6E6E8" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="174.0273" x="221.4558" y="985.8564">parent that existed before it.</text><text fill="#E6E6E8" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="181.1621" x="221.4558" y="1001.5859">Nothing is rewritten, so peers</text><text fill="#E6E6E8" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="143.4316" x="221.4558" y="1017.3154">never fight over the fix.</text><ellipse cx="184.4558" cy="981.1274" fill="none" rx="11" ry="11" style="stroke:#8F8F95;stroke-width:1;"/><ellipse cx="184.4558" cy="981.1274" fill="#222222" rx="6" ry="6" style="stroke:#8F8F95;stroke-width:1;"/><line style="stroke:#8F8F95;stroke-width:1.2;" x1="184.4558" x2="184.4558" y1="100.0889" y2="120.0889"/><polygon fill="#8F8F95" points="180.4558,110.0889,184.4558,120.0889,188.4558,110.0889,184.4558,114.0889" style="stroke:#8F8F95;stroke-width:1;"/><line style="stroke:#8F8F95;stroke-width:1.2;" x1="184.4558" x2="184.4558" y1="155.8184" y2="175.8184"/><polygon fill="#8F8F95" points="180.4558,165.8184,184.4558,175.8184,188.4558,165.8184,184.4558,169.8184" style="stroke:#8F8F95;stroke-width:1;"/><line style="stroke:#8F8F95;stroke-width:1.2;" x1="184.4558" x2="184.4558" y1="211.5479" y2="231.5479"/><polygon fill="#8F8F95" points="180.4558,221.5479,184.4558,231.5479,188.4558,221.5479,184.4558,225.5479" style="stroke:#8F8F95;stroke-width:1;"/><line style="stroke:#8F8F95;stroke-width:1.2;" x1="184.4558" x2="184.4558" y1="283.0068" y2="303.0068"/><polygon fill="#8F8F95" points="180.4558,293.0068,184.4558,303.0068,188.4558,293.0068,184.4558,297.0068" style="stroke:#8F8F95;stroke-width:1;"/><line style="stroke:#8F8F95;stroke-width:1.2;" x1="184.4558" x2="184.4558" y1="395.7363" y2="415.7363"/><polygon fill="#8F8F95" points="180.4558,405.7363,184.4558,415.7363,188.4558,405.7363,184.4558,409.7363" style="stroke:#8F8F95;stroke-width:1;"/><line style="stroke:#8F8F95;stroke-width:1.2;" x1="184.4558" x2="184.4558" y1="467.1953" y2="487.1953"/><polygon fill="#8F8F95" points="180.4558,477.1953,184.4558,487.1953,188.4558,477.1953,184.4558,481.1953" style="stroke:#8F8F95;stroke-width:1;"/><line style="stroke:#8F8F95;stroke-width:1.2;" x1="184.4558" x2="184.4558" y1="690.4268" y2="710.4268"/><polygon fill="#8F8F95" points="180.4558,700.4268,184.4558,710.4268,188.4558,700.4268,184.4558,704.4268" style="stroke:#8F8F95;stroke-width:1;"/><line style="stroke:#8F8F95;stroke-width:1.2;" x1="184.4558" x2="184.4558" y1="590.1133" y2="623.2383"/><polygon fill="#8F8F95" points="180.4558,613.2383,184.4558,623.2383,188.4558,613.2383,184.4558,617.2383" style="stroke:#8F8F95;stroke-width:1;"/><line style="stroke:#8F8F95;stroke-width:1.2;" x1="184.4558" x2="184.4558" y1="761.8857" y2="771.8857"/><line style="stroke:#8F8F95;stroke-width:1.2;" x1="184.4558" x2="341.9116" y1="771.8857" y2="771.8857"/><polygon fill="#8F8F95" points="337.9116,688.9375,341.9116,678.9375,345.9116,688.9375,341.9116,684.9375" style="stroke:#8F8F95;stroke-width:1.2;"/><line style="stroke:#8F8F95;stroke-width:1.2;" x1="341.9116" x2="341.9116" y1="574.3838" y2="771.8857"/><line style="stroke:#8F8F95;stroke-width:1.2;" x1="341.9116" x2="265.3469" y1="574.3838" y2="574.3838"/><polygon fill="#8F8F95" points="275.3469,570.3838,265.3469,574.3838,275.3469,578.3838,271.3469,574.3838" style="stroke:#8F8F95;stroke-width:1;"/><line style="stroke:#8F8F95;stroke-width:1.2;" x1="103.5647" x2="27" y1="574.3838" y2="574.3838"/><polygon fill="#8F8F95" points="23,674.9375,27,684.9375,31,674.9375,27,678.9375" style="stroke:#8F8F95;stroke-width:1.2;"/><line style="stroke:#8F8F95;stroke-width:1.2;" x1="27" x2="27" y1="574.3838" y2="783.8857"/><line style="stroke:#8F8F95;stroke-width:1.2;" x1="27" x2="184.4558" y1="783.8857" y2="783.8857"/><line style="stroke:#8F8F95;stroke-width:1.2;" x1="184.4558" x2="184.4558" y1="783.8857" y2="803.8857"/><polygon fill="#8F8F95" points="180.4558,793.8857,184.4558,803.8857,188.4558,793.8857,184.4558,797.8857" style="stroke:#8F8F95;stroke-width:1;"/><line style="stroke:#8F8F95;stroke-width:1.2;" x1="184.4558" x2="184.4558" y1="538.6543" y2="558.6543"/><polygon fill="#8F8F95" points="180.4558,548.6543,184.4558,558.6543,188.4558,548.6543,184.4558,552.6543" style="stroke:#8F8F95;stroke-width:1;"/><line style="stroke:#8F8F95;stroke-width:1.2;" x1="184.4558" x2="184.4558" y1="855.3447" y2="875.3447"/><polygon fill="#8F8F95" points="180.4558,865.3447,184.4558,875.3447,188.4558,865.3447,184.4558,869.3447" style="stroke:#8F8F95;stroke-width:1;"/><line style="stroke:#8F8F95;stroke-width:1.2;" x1="184.4558" x2="184.4558" y1="926.8037" y2="970.1274"/><polygon fill="#8F8F95" points="180.4558,960.1274,184.4558,970.1274,188.4558,960.1274,184.4558,964.1274" style="stroke:#8F8F95;stroke-width:1;"/></g></svg>