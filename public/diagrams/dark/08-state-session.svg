h:0.5;" x1="74.5" x2="235.9194" y1="443.0889" y2="443.0889"/><text fill="#A0A0A6" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="59.1475" x="125.636" y="434.9531">Proposed</text><text fill="#A0A0A6" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="134.8242" x="79.5" y="460.6826">onion skin and redline</text><text fill="#A0A0A6" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="141.4194" x="79.5" y="476.4121">rendered for reviewers</text></g><g id="Merged"><rect fill="#232326" height="67.1885" rx="4" ry="4" style="stroke:#5A5A60;stroke-width:0.5;" width="191.7612" x="7" y="560.3594"/><line style="stroke:#5A5A60;stroke-width:0.5;" x1="7" x2="198.7612" y1="586.0889" y2="586.0889"/><text fill="#A0A0A6" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="47.728" x="79.0166" y="577.9531">Merged</text><text fill="#A0A0A6" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="80.374" x="12" y="603.6826">ops are kept,</text><text fill="#A0A0A6" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="171.7612" x="12" y="619.4121">so the session is still history</text></g><g id="Abandoned"><rect fill="#232326" height="67.1885" rx="4" ry="4" style="stroke:#5A5A60;stroke-width:0.5;" width="154.7163" x="234.5" y="560.3594"/><line style="stroke:#5A5A60;stroke-width:0.5;" x1="234.5" x2="389.2163" y1="586.0889" y2="586.0889"/><text fill="#A0A0A6" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="70.8843" x="276.416" y="577.9531">Abandoned</text><text fill="#A0A0A6" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="94.269" x="239.5" y="603.6826">kept as history;</text><text fill="#A0A0A6" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="134.7163" x="239.5" y="619.4121">can be re-forked later</text></g><ellipse cx="207" cy="699.3594" fill="none" rx="11" ry="11" style="stroke:#E6E