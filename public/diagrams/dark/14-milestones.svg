<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="256px" preserveAspectRatio="none" style="width:1280px;height:256px;" version="1.1" viewBox="0 0 1280 256" width="1280px" zoomAndPan="magnify"><title>Milestones</title><defs/><g><g class="title" data-source-line="2"><text fill="#E4E6EB" font-family="Helvetica" font-size="16" font-weight="bold" lengthAdjust="spacing" textLength="86.1953" x="590.3103" y="25.5">Milestones</text></g><!--entity m1--><g class="entity" data-entity="m1" data-source-line="6" data-uid="ent0002" id="entity_m1"><rect fill="#232832" height="130.1064" rx="4" ry="4" width="217.9517" x="7" y="47.3594"/><text fill="#E4E6EB" font-family="Helvetica" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="17.7163" x="17" y="69.9531">M1</text><text fill="#E4E6EB" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="141.5273" x="17" y="85.6826">Headless convergence</text><text fill="#E4E6EB" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="3.6563" x="17" y="101.4121">&#160;</text><text fill="#E4E6EB" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="132.228" x="17" y="117.1416">CLI peers + an Erlang</text><text fill="#E4E6EB" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="133.396" x="17" y="132.8711">tracker, all on Xmesh,</text><text fill="#E4E6EB" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="166.499" x="17" y="148.6006">over WebSocket, replaying</text><text fill="#E4E6EB" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="197.9517" x="17" y="164.3301">vectors with forced disconnects</text></g><!--entity m2--><g class="entity" data-entity="m2" data-source-line="7" data-uid="ent0003" id="entity_m2"><rect fill="#232832" height="114.377" rx="4" ry="4" width="173.8672" x="354" y="115.3594"/><text fill="#E4E6EB" font-family="Helvetica" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="20.2998" x="364" y="137.9531">M2</text><text fill="#E4E6EB" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="108.564" x="364" y="153.6826">Inkscape + no-JS</text><text fill="#E4E6EB" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="3.6563" x="364" y="169.4121">&#160;</text><text fill="#E4E6EB" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="153.8672" x="364" y="185.1416">Inkscape fork MUPPET +</text><text fill="#E4E6EB" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="146.0977" x="364" y="200.8711">server MUPPET serving</text><text fill="#E4E6EB" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="70.04" x="364" y="216.6006">plain HTML</text></g><!--entity m3--><g class="entity" data-entity="m3" data-source-line="8" data-uid="ent0004" id="entity_m3"><rect fill="#232832" height="98.6475" rx="4" ry="4" width="129.7065" x="589" y="122.8594"/><text fill="#E4E6EB" font-family="Helvetica" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="20.5029" x="599" y="145.4531">M3</text><text fill="#E4E6EB" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="109.7065" x="599" y="161.1826">Inkscape + Wasm</text><text fill="#E4E6EB" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="3.6563" x="599" y="176.9121">&#160;</text><text fill="#E4E6EB" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="108.5068" x="599" y="192.6416">browser MUPPET</text><text fill="#E4E6EB" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="91.9648" x="599" y="208.3711">(Wasm polyfill)</text></g><!--entity m4--><g class="entity" data-entity="m4" data-source-line="9" data-uid="ent0005" id="entity_m4"><rect fill="#232832" height="114.377" rx="4" ry="4" width="179.999" x="780" y="115.3594"/><text fill="#E4E6EB" font-family="Helvetica" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="20.9028" x="790" y="137.9531">M4</text><text fill="#E4E6EB" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="159.999" x="790" y="153.6826">Inkscape + Conversations</text><text fill="#E4E6EB" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="3.6563" x="790" y="169.4121">&#160;</text><text fill="#E4E6EB" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="135.478" x="790" y="185.1416">mobile and chat users</text><text fill="#E4E6EB" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="124.9727" x="790" y="200.8711">via the XMPP bridge</text><text fill="#E4E6EB" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="153.1563" x="790" y="216.6006">(scope: open question 7)</text></g><!--entity gw--><g class="entity" data-entity="gw" data-source-line="11" data-uid="ent0006" id="entity_gw"><rect fill="#4A3519" height="37.459" rx="4" ry="4" width="200.5527" x="15.5" y="212.8594"/><text fill="#E4E6EB" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="107.269" x="25.5" y="228.4531">xtxp.link gateway</text><text fill="#E4E6EB" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="180.5527" x="25.5" y="244.1826">(placement: open question 9)</text></g><!--entity rm--><g class="entity" data-entity="rm" data-source-line="13" data-uid="ent0007" id="entity_rm"><rect fill="#4A3519" height="84.6475" rx="4" ry="4" width="175.8159" x="1099" y="129.8594"/><text fill="#E4E6EB" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="58.0684" x="1109" y="145.4531">Roadmap</text><text fill="#E4E6EB" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="115.1338" x="1109" y="161.1826">ledger, keyframes,</text><text fill="#E4E6EB" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="81.2944" x="1109" y="176.9121">history limits,</text><text fill="#E4E6EB" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="155.8159" x="1109" y="192.6416">native C++ / Elixir spikes,</text><text fill="#E4E6EB" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="118.1553" x="1109" y="208.3711">signed hash chains</text></g><!--link m1 to m2--><g class="link" data-entity-1="m1" data-entity-2="m2" data-source-line="15" data-uid="lnk8" id="link_m1_m2"><path d="M225,132.4194 C266.91,140.2094 308.331,147.9034 347.891,155.2534" fill="none" id="m1-to-m2" style="stroke:#8F9AAB;stroke-width:1.2;"/><polygon fill="#8F9AAB" points="353.79,156.3494,345.6721,150.7727,348.8741,155.436,344.2108,158.6381,353.79,156.3494" style="stroke:#8F9AAB;stroke-width:1.2;"/></g><!--link m2 to m3--><g class="link" data-entity-1="m2" data-entity-2="m3" data-source-line="16" data-uid="lnk9" id="link_m2_m3"><path d="M528.13,172.3594 C548.41,172.3594 563.68,172.3594 582.81,172.3594" fill="none" id="m2-to-m3" style="stroke:#8F9AAB;stroke-width:1.2;"/><polygon fill="#8F9AAB" points="588.81,172.3594,579.81,168.3594,583.81,172.3594,579.81,176.3594,588.81,172.3594" style="stroke:#8F9AAB;stroke-width:1.2;"/></g><!--link m3 to m4--><g class="link" data-entity-1="m3" data-entity-2="m4" data-source-line="17" data-uid="lnk10" id="link_m3_m4"><path d="M719.21,172.3594 C738.29,172.3594 753.55,172.3594 773.91,172.3594" fill="none" id="m3-to-m4" style="stroke:#8F9AAB;stroke-width:1.2;"/><polygon fill="#8F9AAB" points="779.91,172.3594,770.91,168.3594,774.91,172.3594,770.91,176.3594,779.91,172.3594" style="stroke:#8F9AAB;stroke-width:1.2;"/></g><!--link gw to m2--><g class="link" data-entity-1="gw" data-entity-2="m2" data-source-line="18" data-uid="lnk11" id="link_gw_m2"><path d="M216.55,213.1794 C260.48,205.1494 305.7177,196.8876 347.9777,189.1676" fill="none" id="gw-to-m2" style="stroke:#8F9AAB;stroke-width:1.2;stroke-dasharray:7,7;"/><polygon fill="#8F9AAB" points="353.88,188.0894,344.3077,185.7718,348.9614,188.9879,345.7453,193.6416,353.88,188.0894" style="stroke:#8F9AAB;stroke-width:1.2;"/><text fill="#9AA3B2" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="59.4023" x="260.2568" y="175.9844">candidate:</text><text fill="#9AA3B2" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="67.916" x="256" y="190.5039">fold into M2</text></g><!--link m4 to rm--><g class="link" data-entity-1="m4" data-entity-2="rm" data-source-line="19" data-uid="lnk12" id="link_m4_rm"><path d="M960,172.3594 C1003.48,172.3594 1049.62,172.3594 1092.85,172.3594" fill="none" id="m4-to-rm" style="stroke:#8F9AAB;stroke-width:1.2;stroke-dasharray:7,7;"/><polygon fill="#8F9AAB" points="1098.85,172.3594,1089.85,168.3594,1093.85,172.3594,1089.85,176.3594,1098.85,172.3594" style="stroke:#8F9AAB;stroke-width:1.2;"/><text fill="#9AA3B2" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="77.1504" x="991" y="168.9844">when needed</text></g></g></svg>