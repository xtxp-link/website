font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="17.7163" x="338" y="69.9531">M1</text><text fill="#E6E6E8" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="141.5273" x="338" y="85.6826">Headless convergence</text><text fill="#E6E6E8" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="3.6563" x="338" y="101.4121">&#160;</text><text fill="#E6E6E8" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="152.4009" x="338" y="117.1416">3 CLI peers + a headless</text><text fill="#E6E6E8" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="166.9941" x="338" y="132.8711">muppet host, all on Xmesh,</text><text fill="#E6E6E8" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="166.499" x="338" y="148.6006">over WebSocket, replaying</text><text fill="#E6E6E8" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="197.9517" x="338" y="164.3301">vectors with forced disconnects</text></g><!--entity m2--><g class="entity" data-entity="m2" data-source-line="8" data-uid="ent0004" id="entity_m2"><rect fill="#232326" height="114.377" rx="4" ry="4" width="166.4658" x="607" y="55.3594"/><text fill="#E6E6E8" font-family="Helvetica" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="20.2998" x="617" y="77.9531">M2</text><text fill="#E6E6E8" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="108.564" x="617" y="93.6826">Inkscape + no-JS</text><text fill="#E6E6E8" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="3.6563" x="617" y="109.4121">&#160;</text><text fill="#E6E6E8" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="146.4658" x="617" y="125.1416">Inkscape fork muppet +</text><text fill="#E6E6E8" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="138.6963" x="617" y="140.8711">server muppet serving</text><text fill="#E6E6E8" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="70.04" x="617" y="156.6006">plain HTML</text></g><!--entity m3--><g class="entity" data-entity="m3" data-source-line="9" data-uid="ent0005" id="entity_m3"><rect fill="#232326" height="98.6475" rx="4" ry="4" width="129.7065" x="834" y="62.8594"/><text fill="#E6E6E8" font-family="Helvetica" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="20.5029" x="844" y="85.4531">M3</text><text fill="#E6E6E8" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="109.7065" x="844" y="101.1826">Inkscape + Wasm</text><text fill="#E6E6E8" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="3.6563" x="844" y="116.9121">&#160;</text><text fill="#E6E6E8" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="101.1055" x="844" y="132.6416">browser muppet</text><text fill="#E6E6E8" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="101.9624" x="844" y="148.3711">(full Wasm peer)</text></g><!--entity m4--><g class="entity" data-entity="m4" data-source-line="10" data-uid="ent0006" id="entity_m4"><rect fill="#232326" height="114.377" rx="4" ry="4" width="179.999" x="1035.5" y="55.3594"/><text fill="#E6E6E8" font-family="Helvetica" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="20.9028" x="1045.5" y="77.9531">M4</text><text fill="#E6E6E8" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="159.999" x="1045.5" y="93.6826">Inkscape + Conversations</text><text fill="#E6E6E8" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="3.6563" x="1045.5" y="109.4121">&#160;</text><text fill="#E6E6E8" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="135.478" x="1045.5" y="125.1416">mobile and chat users</text><text fill="#E6E6E8" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="124.9727" x="1045.5" y="140.8711">via the XMPP bridge</text><text fill="#E6E6E8" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="153.1563" x="1045.5" y="156.6006">(scope: open question 7)</text></g><!--entity disco--><g class="entity" data-entity="disco" data-source-line="12" data-uid="ent0007" id="entity_disco"><rect fill="#232326" height="98.6475" rx="4" ry="4" width="165.6216" x="1365" y="185.8594"/><text fill="#E6E6E8" font-family="Helvetica" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="32.6968" x="1375" y="208.4531">Later</text><text fill="#E6E6E8" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="110.9888" x="1375" y="224.1826">The muppet disco</text><text fill="#E6E6E8" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="3.6563" x="1375" y="239.9121">&#160;</text><text fill="#E6E6E8" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="145.6216" x="1375" y="255.6416">discovery, the bouncer,</text><text fill="#E6E6E8" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="63.0005" x="1375" y="271.3711">federation</text></g><!--entity gw--><g class="entity" data-entity="gw" data-source-line="13" data-uid="ent0008" id="entity_gw"><rect fill="#2E2E32" height="37.459" rx="4" ry="4" width="200.5527" x="1025" y="216.8594"/><text fill="#E6E6E8" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="120.6245" x="1035" y="232.4531">Live web branching</text><text fill="#E6E6E8" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="180.5527" x="1035" y="248.1826">(placement: open question 9)</text></g><!--entity rm--><g class="entity" data-entity="rm" data-source-line="15" data-uid="ent0009" id="entity_rm"><rect fill="#2E2E32" height="100.377" rx="4" ry="4" width="145.8931" x="1375" y="50.3594"/><text fill="#E6E6E8" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="58.0684" x="1385" y="65.9531">Roadmap</text><text fill="#E6E6E8" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="115.1338" x="1385" y="81.6826">ledger, keyframes,</text><text fill="#E6E6E8" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="81.2944" x="1385" y="97.4121">history limits,</text><text fill="#E6E6E8" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="107.707" x="1385" y="113.1416">native C++ spike,</text><text fill="#E6E6E8" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="125.8931" x="1385" y="128.8711">Elixir/BEAM at scale,</text><text fill="#E6E6E8" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="118.1553" x="1385" y="144.6006">signed hash chains</text></g><!--link m0 to m1--><g class="link" data-entity-1="m0" data-entity-2="m1" data-source-line="17" data-uid="lnk10" id="link_m0_m1"><path d="M183.12,112.3594 C227.19,112.3594 275.1,112.3594 321.81,112.3594" fill="none" id="m0-to-m1" style="stroke:#8F8F95;stroke-width:1.2;"/><polygon fill="#8F8F95" points="327.81,112.3594,318.81,108.3594,322.81,112.3594,318.81,116.3594,327.81,112.3594" style="stroke:#8F8F95;stroke-width:1.2;"/><text fill="#A0A0A6" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="79.916" x="215.6992" y="93.9844">if XTXP's own</text><text fill="#A0A0A6" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="83.3145" x="214" y="108.5039">host is needed</text></g><!--link m1 to m2--><g class="link" data-entity-1="m1" data-entity-2="m2" data-source-line="18" data-uid="lnk11" id="link_m1_m2"><path d="M546.27,112.3594 C566.57,112.3594 581.48,112.3594 600.83,112.3594" fill="none" id="m1-to-m2" style="stroke:#8F8F95;stroke-width:1.2;"/><polygon fill="#8F8F95" points="606.83,112.3594,597.83,108.3594,601.83,112.3594,597.83,116.3594,606.83,112.3594" style="stroke:#8F8F95;stroke-width:1.2;"/></g><!--link m2 to m3--><g class="link" data-entity-1="m2" data-entity-2="m3" data-source-line="