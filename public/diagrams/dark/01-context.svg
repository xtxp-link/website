ntity" data-entity="mobile" data-source-line="10" data-uid="ent0006" id="entity_mobile"><ellipse cx="151.6779" cy="708.3594" fill="#232326" rx="8" ry="8"/><path d="M151.6779,716.3594 L151.6779,743.3594 M138.6779,724.3594 L164.6779,724.3594 M151.6779,743.3594 L138.6779,758.3594 M151.6779,743.3594 L164.6779,758.3594" fill="none"/><text fill="#E6E6E8" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="110.7158" x="96.32" y="771.9531">Mobile / chat user</text><text fill="#E6E6E8" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="83.5923" x="96.32" y="787.6826">(XMPP client)</text></g><!--entity disco--><g class="entity" data-entity="disco" data-source-line="18" data-uid="ent0011" id="entity_disco"><rect fill="#232326" height="82.918" rx="4" ry="4" width="183.0205" x="865.82" y="151.8594"/><text fill="#E6E6E8" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="84.0303" x="875.82" y="174.4531">Muppet disco</text><text fill="#E6E6E8" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="140.5942" x="875.82" y="190.1826">(xtxp.link, or anyone's)</text><text fill="#E6E6E8" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="163.0205" x="875.82" y="205.9121">finds sessions, hosts none</text><text fill="#E6E6E8" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="109.4844" x="875.82" y="221.6416">(future milestone)</text></g><!--entity bridge--><g class="entity" data-entity="bridge" data-source-line="19" data-uid="ent0012" id="entity_bridge"><rect fill="#3D1B15" height="45.7295" rx="4" ry="4" width="120.3867" x="489.82" y="653.3594"/><rect fill="#3D1B15" height="10" width="15" x="590.2067" y="658.3594"/><rect fill="#3D1B15" height="2" width="4" x="588.2067" y="660.3594"/><rect fill="#3D1B15" height="2" width="4" x="588.2067" y="664.3594"/><text fill="#E6E6E8" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="80.3867" x="504.82" y="685.9531">XMPP bridge</text></g><!--entity origin--><g class="entity" data-entity="origin" data-source-line="20" data-uid="ent0013" id="entity_origin"><rect fill="#232326" height="51.459" rx="4" ry="4" width="157.6108" x="1249.32" y="480.8594"/><text fill="#E6E6E8" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="95.3228" x="1259.32" y="503.4531">Origin websites</text><text fill="#E6E6E8" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="137.6108" x="1259.32" y="519.1826">(e.g. en.wikipedia.org)</text></g><!--entity sso--><g class="entity" data-entity="sso" data-source-line="21" data-uid="ent0014" id="entity_sso"><rect fill="#232326" height="67.1885" rx="4" ry="4" width="167.3545" x="873.82" y="269.8594"/><text fill="#E6E6E8" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="99.144" x="883.82" y="292.4531">Sign-in provider</text><text fill="#E6E6E8" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="147.3545" x="883.82" y="308.1826">(Google, Apple, Mozilla)</text><text fill="#E6E6E8" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="130.1206" x="883.82" y="323.9121">+ user's own storage</text></g><g class="entity" data-entity="GMN30" data-source-line="42" data-uid="ent0031" id="entity_GMN30"><path d="M30.32,300.8594 L30.32,334.3184 A4,4 0 0 0 34.32,338.3184 L147.82,338.3184 L151.82,372.9894 L155.82,338.3184 L269.2912,338.3184 A4,4 0 0 0 273.2912,334.3184 L273.2912,306.8594 L263.2912,296.8594 L34.32,296.8594 A4,4 0 0 0 30.32,300.8594" fill="#2F2A1C" style="stroke:#5A5A60;stroke-width:0.5;"/><path d="M263.2912,296.8594 L263.2912,304.8594 A2,2 0 0 0 265.2912,306.8594 L273.2912,306.8594 L263.2912,296.8594" fill="#2F2A1C" style="stroke:#5A5A60;stroke-width:0.5;"/><text fill="#E6E6E8" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="182.7808" x="36.32" y="314.4531">North star: XTXP built into the</text><text fill="#E6E6