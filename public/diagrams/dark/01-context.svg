E6E8" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="221.9712" x="38.72" y="330.1826">browser, a first-class web standard.</text></g><g class="entity" data-entity="GMN33" data-source-line="47" data-uid="ent0034" id="entity_GMN33"><path d="M35.72,502.8594 L35.72,552.0479 A4,4 0 0 0 39.72,556.0479 L150.22,556.0479 L154.22,591.2294 L158.22,556.0479 L268.3816,556.0479 A4,4 0 0 0 272.3816,552.0479 L272.3816,508.8594 L262.3816,498.8594 L39.72,498.8594 A4,4 0 0 0 35.72,502.8594" fill="#2F2A1C" style="stroke:#5A5A60;stroke-width:0.5;"/><path d="M262.3816,498.8594 L262.3816,506.8594 A2,2 0 0 0 264.3816,508.8594 L272.3816,508.8594 L262.3816,498.8594" fill="#2F2A1C" style="stroke:#5A5A60;stroke-width:0.5;"/><text fill="#E6E6E8" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="215.6616" x="41.72" y="516.4531">Compatible everywhere: the Wasm</text><text fill="#E6E6E8" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="190.6392" x="41.72" y="532.1826">polyfill, and no-JS browsers as</text><text fill="#E6E6E8" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="188.354" x="41.72" y="547.9121">full participants, not a fallback.</text></g><!--link designer to peers--><g class="link" data-entity-1="designer" data-entity-2="peers" data-source-line="23" data-uid="lnk15" id="link_designer_peers"><path d="M200.77,112.1194 C223.84,123.2994 251.93,137.9394 275.72,153.3594 C344.98,198.2394 361.08,212.3194 420.72,269.3594 C460.73,307.6294 498.2608,352.021 523.4108,383.171" fill="none" id="designer-to-peers" style="stroke:#8F8F95;stroke-width:1.2;"/><polygon fill="#8F8F95" points="527.18,387.8394,524.6385,378.3241,524.039,383.9491,518.414,383.3496,527.18,387.8394" style="stroke:#8F8F95;stroke-width:1.2;"/><text fill="#A0A0A6" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="103.2422" x="311.72" y="171.9844">edits SVG natively</text></g><!--link wasm to peers--><g class="li