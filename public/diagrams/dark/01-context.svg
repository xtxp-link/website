nt-size="12" lengthAdjust="spacing" textLength="113.0039" x="306.72" y="553.5039">links, HTTP caching</text></g><!--link mobile to bridge--><g class="link" data-entity-1="mobile" data-entity-2="bridge" data-source-line="27" data-uid="lnk19" id="link_mobile_bridge"><path d="M209.87,751.0094 C283.92,736.9894 409.7248,713.1557 486.0848,698.6957" fill="none" id="mobile-to-bridge" style="stroke:#8F8F95;stroke-width:1.2;"/><polygon fill="#8F8F95" points="491.98,697.5794,482.3929,695.3238,487.0673,698.5097,483.8814,703.1841,491.98,697.5794" style="stroke:#8F8F95;stroke-width:1.2;"/><text fill="#A0A0A6" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="94.3242" x="316.5296" y="693.9844">chat, comments,</text><text fill="#A0A0A6" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="102.9434" x="312.22" y="708.5039">push when asleep</text></g><!--link server to hosts--><g class="link" data-entity-1="server" data-entity-2="hosts" data-source-line="28" data-uid="lnk20" id="link_server_hosts"><path d="M651.9,512.4094 C716.25,511.1394 793.7912,509.6181 857.4512,508.3581" fill="none" id="server-to-hosts" style="stroke:#8F8F95;stroke-width:1.2;"/><polygon fill="#8F8F95" points="863.45,508.2394,854.3726,504.4183,858.451,508.3383,854.5309,512.4167,863.45,508.2394" style="stroke:#8F8F95;stroke-width:1.2;"/><text fill="#A0A0A6" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="58.9512" x="728.72" y="505.9844">in process</text></g><!--link peers to hosts--><g class="link" data-entity-1="peers" data-entity-2="hosts" data-source-line="29" data-uid="lnk21" id="link_peers_hosts"><path d="M629.02,434.8094 C695.38,449.2094 786.2466,468.9264 857.7766,484.4564" fill="none" id="peers-to-hosts" style="stroke:#8F8F95;stroke-width:1.2;"/><polygon fill="#8F8F95" points="863.64,485.7294,855.6936,479.9109,858.7538,484.6685,853.9962,487.7288,863.64,485.7294" style="stroke:#8F8F95;stroke-width:1.2;"/><text fill="#A0A0A6" font-family="H