ticipant participant-head" data-participant="node"><rect fill="#232832" height="29.7295" rx="4" ry="4" style="stroke:#5B6577;stroke-width:0.5;" width="96.0435" x="594.3904" y="61.0889"/><text fill="#E4E6EB" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="82.0435" x="601.3904" y="80.6826">Hosting node</text></g><g class="participant participant-tail" data-participant="node"><rect fill="#232832" height="29.7295" rx="4" ry="4" style="stroke:#5B6577;stroke-width:0.5;" width="96.0435" x="594.3904" y="580.5791"/><text fill="#E4E6EB" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="82.0435" x="601.3904" y="600.1729">Hosting node</text></g><g class="message" data-participant-1="c" data-participant-2="gw"><polygon fill="#8F9AAB" points="344.9634,118.3379,354.9634,122.3379,344.9634,126.3379,348.9634,122.3379" style="stroke:#8F9AAB;stroke-width:1;"/><line style="stroke:#8F9AAB;stroke-width:1.2;" x1="44.6528" x2="350.9634" y1="122.3379" y2="122.3379"/><text fill="#9AA3B2" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="194.1094" x="51.6528" y="117.4434">GET https://xtxp.link/{host}/{path}</text></g><g class="message" data-participant-1="gw" data-participant-2="dir"><polygon fill="#8F9AAB" points="537.0513,146.8574,547.0513,150.8574,537.0513,154.8574,541.0513,150.8574" style="stroke:#8F9AAB;stroke-width:1;"/><line style="stroke:#8F9AAB;stroke-width:1.2;" x1="356.9634" x2="543.0513" y1="150.8574" y2="150.8574"/><text fill="#9AA3B2" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="142.3242" x="363.9634" y="145.9629">who hosts {host}/{path}?</text></g><g class="message" data-participant-1="dir" data-participant-2="gw"><polygon fill="#8F9AAB" points="367.9634,175.377,357.9634,179.377,367.9634,183.377,363.9634,179.377" style="stroke:#8F9AAB;stroke-width:1;"/><line style="stroke:#8F9AAB;stroke-width:1.2;stroke-dasharray:2,2;" x1="361.9634" x2="548.0513" y1="179.377" y2="179.377"/><text fill="#9AA3B2" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="168.0879" x="373.9634" y="174.4824">node + branch + latest vector</text></g><path d="M14,194.377 L70.8311,194.377 L70.8311,202.1064 L60.8311,212.1064 L10,212.1064 L10,198.377 A4,4 0 0 1 14,194.377" fill="#2B3240" style="stroke:#5B6577;stroke-width:1.5;"/><rect fill="none" height="150.7861" rx="4" ry="4" style="stroke:#5B6577;stroke-width:1.5;" width="690.4338" x="10" y="194.377"/><text fill="#E4E6EB" font-family="Helvetica" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="15.8311" x="25" y="207.9707">alt</text><text fill="#E4E6EB" font-family="Helvetica" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="198.2881" x="85.8311" y="208.9707">[Accept: application/xtxp+xml]</text><g class="message" data-participant-1="gw" data-participant-2="node"><polygon fill="#8F9AAB" points="630.4121,229.3555,640.4121,233.3555,630.4121,237.3555,634.4121,233.3555" style="stroke:#8F9AAB;stroke-width:1;"/><line style="stroke:#8F9AAB;stroke-width:1.2;" x1="356.9634" x2="636.4121" y1="233.3555" y2="233.3555"/><text fill="#9AA3B2" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="106.3652" x="363.9634" y="228.4609">open patch stream</text></g><g class="message" data-participant-1="gw" data-participant-2="c"><polygon fill="#8F9AAB" points="55.6528,257.875,45.6528,261.875,55.6528,265.875,51.6528,261.875" style="stroke:#8F9AAB;stroke-width:1;"/><line style="stroke:#8F9AAB;stroke-width:1.2;stroke-dasharray:2,2;" x1="49.6528" x2="355.9634" y1="261.875" y2="261.875"/><text fill="#9AA3B2" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="133.9688" x="61.6528" y="256.9805">raw XTXP patch stream</text></g><line style="stroke:#5B6577;stroke-width:1;stroke-dasharray:2,2;" x1="10" x2="700.4338" y1="270.875" y2="270.875"/><text fill="#E4E6EB" font-family="Helvetica" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="121.0181" x="15" y="283.4688">[Accept: text/html]</text><g class="message" data-participant-1="gw" data-participant-2="c"><polygon fill="#8F9AAB" points="55.6528,333.1631,45.6528,337.1631,55.6528,341.1631,51.6528,337.1631" style="stroke:#8F9AAB;stroke-width:1;"/><line style="stroke:#8F9AAB;stroke-width:1.2;stroke-dasharray:2,2;" x1="49.6528" x2="355.9634" y1="337.1631" y2="337.1631"/><text fill="#9AA3B2" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="181.5879" x="61.6528" y="303.2295">rendered current state as HTML</text><text fill="#9AA3B2" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="135.9199" x="61.6528" y="317.749">+ forms that POST edits</text><text fill="#9AA3B2" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="288.3105" x="61.6528" y="332.2686">+ link "open in native client" &#8594; xtxp://{host}/{path}</text></g><path d="M203,361.1631 L203,410.1631 A4,4 0 0 0 207,414.1631 L505,414.1631 A4,4 0 0 0 509,410.1631 L509,367.1631 L499,357.1631 L207,357.1631 A4,4 0 0 0 203,361.1631" fill="#2F2A1C" style="stroke:#5B6577;stroke-width:0.5;"/><path d="M499,357.1631 L499,365.1631 A2,2 0 0 0 501,367.1631 L509,367.1631 L499,357.1631" fill="#2F2A1C" style="stroke:#5B6577;stroke-width:0.5;"/><text fill="#E4E6EB" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="285.0098" x="209" y="374.7568">A server cannot tell whether an xtxp:// handler</text><text fill="#E4E6EB" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="265.5605" x="209" y="390.4863">is installed, and a meta refresh to a missing</text><text fill="#E4E6EB" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="278.0083" x="209" y="406.2158">handler fails silently, so the hand-off is a link.</text><rect fill="#2B3240" height="3" rx="4" ry="4" style="stroke:#2B3240;stroke-width:1;" width="710.4338" x="0" y="440.2163"/><line style="stroke:#5B6577;stroke-width:1;" x1="0" x2="710.4338" y1="440.2163" y2="440.2163"/><line style="stroke:#5B6577;stroke-width:1;" x1="0" x2="710.4338" y1="443.2163" y2="443.2163"/><rect fill="#2B3240" height="23.7295" rx="4" ry="4" style="stroke:#5B6577;stroke-width:2;" width="165.728" x="272.3529" y="429.3516"/><text fill="#E4E6EB" font-family="Helvetica" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="148.6494" x="278.3529" y="445.9453">deep link (syntax open)</text><g class="message" data-participant-1="c" data-participant-2="gw"><polygon fill="#8F9AAB" points="344.9634,479.6006,354.9634,483.6006,344.9634,487.6006,348.9634,483.6006" style="stroke:#8F9AAB;stroke-width:1;"/><line style="stroke:#8F9AAB;stroke-width:1.2;" x1="44.6528" x2="350.9634" y1="483.6006" y2="483.6006"/><text fill="#9AA3B2" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="208.5527" x="51.6528" y="478.7061">GET /{host}/{path}?at={state vector}</text></g><g class="message" data-participant-1="gw" data-participant-2="c"><polygon fill="#8F9AAB" points="55.6528,508.1201,45.6528,512.1201,55.6528,516.1201,51.6528,512.1201" style="stroke:#8F9AAB;stroke-width:1;"/><line style="stroke:#8F9AAB;stroke-width:1.2;stroke-dasharray:2,2;" x1="49.6528" x2="355.9634" y1="512.1201" y2="512.1201"/><text fill="#9AA3B2" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="254.1328" x="61.6528" y="507.2256">the document exactly as it was at that vector</text></g><path d="M10,529.1201 L10,562.1201 A4,4 0 0 0 14,566.1201 L671,566.1201 A4,4 0 0 0 675,562.1201 L675,535.1201 L665,525.1201 L14,525.1201 A4,4 0 0 0 10,529.1201" fill="#2F2A1C" style="stroke:#5B6577;stroke-width:0.5;"/><path d="M665,525.1201 L665,533.1201 A2,2 0 0 0 667,535.1201 L675,535.1201 L665,525.1201" fill="#2F2A1C" style="stroke:#5B6577;stroke-width:0.5;"/><text fill="#E4E6EB" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="360.4707" x="143.2677" y="542.7139">/{host}/{path} is a native XTXP document hosted at {host}.</text><text fill="#E4E6EB" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="389.8984" x="143.2677" y="558.4434">/@/{domain}/{path} is a proxied overlay of an ordinary website.</text></g></svg>