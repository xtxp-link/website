<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="SEQUENCE" height="632px" preserveAspectRatio="none" style="width:610px;height:632px;" version="1.1" viewBox="0 0 610 632" width="610px" zoomAndPan="magnify"><title>Discovery and content negotiation</title><defs/><g><text fill="#E6E6E8" font-family="Helvetica" font-size="16" font-weight="bold" lengthAdjust="spacing" textLength="269.3203" x="171.4521" y="30.5">Discovery and content negotiation</text><rect fill="none" height="179.3057" rx="4" ry="4" style="stroke:#5A5A60;stroke-width:1.5;" width="593.2246" x="10" y="250.9355"/><g><title>Client</title><rect fill="#000000" fill-opacity="0.00000" height="489.7998" width="8" x="40.6528" y="91.8184"/><line style="stroke:#5A5A60;stroke-width:0.5;stroke-dasharray:5,5;" x1="44" x2="44" y1="91.8184" y2="581.6182"/></g><g><title>Muppet disco</title><rect fill="#000000" fill-opacity="0.00000" height="489.7998" width="8" x="296.5376" y="91.8184"/><line style="stroke:#5A5A60;stroke-width:0.5;stroke-dasharray:5,5;" x1="300.5225" x2="300.5225" y1="91.8184" y2="581.6182"/></g><g><title>Hosting MUPPET</title><rect fill="#000000" fill-opacity="0.00000" height="489.7998" width="8" x="529.5962" y="91.8184"/><line style="stroke:#5A5A60;stroke-width:0.5;stroke-dasharray:5,5;" x1="532.9678" x2="532.9678" y1="91.8184" y2="581.6182"/></g><g class="participant participant-head" data-participant="c"><rect fill="#232326" height="29.7295" rx="4" ry="4" style="stroke:#5A5A60;stroke-width:0.5;" width="49.3057" x="20" y="61.0889"/><text fill="#E6E6E8" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="35.3057" x="27" y="80.6826">Client</text></g><g class="participant participant-tail" data-participant="c"><rect fill="#232326" height="29.7295" rx="4" ry="4" style="stroke:#5A5A60;stroke-width:0.5;" width="49.3057" x="20" y="580.6182"/><text fill="#E6E6E8" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="35.3057" x="27" y="600.2119">Client</text></g><g class="participant participant-head" data-participant="gw"><rect fill="#232326" height="45.459" rx="4" ry="4" style="stroke:#5A5A60;stroke-width:0.5;" width="98.0303" x="251.5225" y="45.3594"/><text fill="#E6E6E8" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="84.0303" x="258.5225" y="64.9531">Muppet disco</text><text fill="#E6E6E8" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="60.7471" x="270.1641" y="80.6826">(xtxp.link)</text></g><g class="participant participant-tail" data-participant="gw"><rect fill="#232326" height="45.459" rx="4" ry="4" style="stroke:#5A5A60;stroke-width:0.5;" width="98.0303" x="251.5225" y="580.6182"/><text fill="#E6E6E8" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="84.0303" x="258.5225" y="600.2119">Muppet disco</text><text fill="#E6E6E8" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="60.7471" x="270.1641" y="615.9414">(xtxp.link)</text></g><g class="participant participant-head" data-participant="node"><rect fill="#232326" height="29.7295" rx="4" ry="4" style="stroke:#5A5A60;stroke-width:0.5;" width="119.2568" x="473.9678" y="61.0889"/><text fill="#E6E6E8" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="105.2568" x="480.9678" y="80.6826">Hosting MUPPET</text></g><g class="participant participant-tail" data-participant="node"><rect fill="#232326" height="29.7295" rx="4" ry="4" style="stroke:#5A5A60;stroke-width:0.5;" width="119.2568" x="473.9678" y="580.6182"/><text fill="#E6E6E8" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="105.2568" x="480.9678" y="600.2119">Hosting MUPPET</text></g><g class="message" data-participant-1="c" data-participant-2="gw"><polygon fill="#8F8F95" points="288.5376,132.8574,298.5376,136.8574,288.5376,140.8574,292.5376,136.8574" style="stroke:#8F8F95;stroke-width:1;"/><line style="stroke:#8F8F95;stroke-width:1.2;" x1="44.6528" x2="294.5376" y1="136.8574" y2="136.8574"/><text fill="#A0A0A6" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="231.8848" x="51.6528" y="117.4434">GET https://xtxp.link/{host}/{path}@{ref}</text><text fill="#A0A0A6" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="200.7246" x="51.6528" y="131.9629">(+ query signed by the client's key)</text></g><g class="message" data-participant-1="gw" data-participant-2="gw"><line style="stroke:#8F8F95;stroke-width:1.2;" x1="300.5376" x2="342.5376" y1="179.8965" y2="179.8965"/><line style="stroke:#8F8F95;stroke-width:1.2;" x1="342.5376" x2="342.5376" y1="179.8965" y2="192.8965"/><line style="stroke:#8F8F95;stroke-width:1.2;" x1="301.5376" x2="342.5376" y1="192.8965" y2="192.8965"/><polygon fill="#8F8F95" points="311.5376,188.8965,301.5376,192.8965,311.5376,196.8965,307.5376,192.8965" style="stroke:#8F8F95;stroke-width:1;"/><text fill="#A0A0A6" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="174.3633" x="307.5376" y="160.4824">which MUPPETs host sessions</text><text fill="#A0A0A6" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="219.0586" x="307.5376" y="175.002">of {host}/{path} that this key may see?</text></g><g class="message" data-participant-1="gw" data-participant-2="c"><polygon fill="#8F8F95" points="55.6528,231.9355,45.6528,235.9355,55.6528,239.9355,51.6528,235.9355" style="stroke:#8F8F95;stroke-width:1;"/><line style="stroke:#8F8F95;stroke-width:1.2;stroke-dasharray:2,2;" x1="49.6528" x2="299.5376" y1="235.9355" y2="235.9355"/><text fill="#A0A0A6" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="157.3242" x="61.6528" y="216.5215">303 &#8594; the hosting MUPPET</text><text fill="#A0A0A6" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="157.4531" x="61.6528" y="231.041">(or a list of visible sessions)</text></g><path d="M14,250.9355 L70.8311,250.9355 L70.8311,258.665 L60.8311,268.665 L10,268.665 L10,254.9355 A4,4 0 0 1 14,250.9355" fill="#2B2B2F" style="stroke:#5A5A60;stroke-width:1.5;"/><rect fill="none" height="179.3057" rx="4" ry="4" style="stroke:#5A5A60;stroke-width:1.5;" width="593.2246" x="10" y="250.9355"/><text fill="#E6E6E8" font-family="Helvetica" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="15.8311" x="25" y="264.5293">alt</text><text fill="#E6E6E8" font-family="Helvetica" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="198.2881" x="85.8311" y="265.5293">[Accept: application/xtxp+xml]</text><g class="message" data-participant-1="c" data-participant-2="node"><polygon fill="#8F8F95" points="521.5962,285.9141,531.5962,289.9141,521.5962,293.9141,525.5962,289.9141" style="stroke:#8F8F95;stroke-width:1;"/><line style="stroke:#8F8F95;stroke-width:1.2;" x1="44.6528" x2="527.5962" y1="289.9141" y2="289.9141"/><text fill="#A0A0A6" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="106.3652" x="51.6528" y="285.0195">open patch stream</text></g><g class="message" data-participant-1="node" data-participant-2="c"><polygon fill="#8F8F95" points="55.6528,314.4336,45.6528,318.4336,55.6528,322.4336,51.6528,318.4336" style="stroke:#8F8F95;stroke-width:1;"/><line style="stroke:#8F8F95;stroke-width:1.2;stroke-dasharray:2,2;" x1="49.6528" x2="532.5962" y1="318.4336" y2="318.4336"/><text fill="#A0A0A6" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="133.9688" x="61.6528" y="313.5391">raw XTXP patch stream</text></g><line style="stroke:#5A5A60;stroke-width:1;stroke-dasharray:2,2;" x1="10" x2="603.2246" y1="327.4336" y2="327.4336"/><text fill="#E6E6E8" font-family="Helvetica" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="121.0181" x="15" y="340.0273">[Accept: text/html]</text><g class="message" data-participant-1="c" data-participant-2="node"><polygon fill="#8F8F95" points="521.5962,360.6826,531.5962,364.6826,521.5962,368.6826,525.5962,364.6826" style="stroke:#8F8F95;stroke-width:1;"/><line style="stroke:#8F8F95;stroke-width:1.2;" x1="44.6528" x2="527.5962" y1="364.6826" y2="364.6826"/><text fill="#A0A0A6" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="23.9121" x="51.6528" y="359.7881">GET</text></g><g class="message" data-participant-1="node" data-participant-2="c"><polygon fill="#8F8F95" points="55.6528,418.2412,45.6528,422.2412,55.6528,426.2412,51.6528,422.2412" style="stroke:#8F8F95;stroke-width:1;"/><line style="stroke:#8F8F95;stroke-width:1.2;stroke-dasharray:2,2;" x1="49.6528" x2="532.5962" y1="422.2412" y2="422.2412"/><text fill="#A0A0A6" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="181.5879" x="61.6528" y="388.3076">rendered current state as HTML</text><text fill="#A0A0A6" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="135.9199" x="61.6528" y="402.8271">+ forms that POST edits</text><text fill="#A0A0A6" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="326.0859" x="61.6528" y="417.3467">+ link "open in native client" &#8594; xtxp://{host}/{path}@{ref}</text></g><path d="M136,446.2412 L136,495.2412 A4,4 0 0 0 140,499.2412 L460,499.2412 A4,4 0 0 0 464,495.2412 L464,452.2412 L454,442.2412 L140,442.2412 A4,4 0 0 0 136,446.2412" fill="#2F2A1C" style="stroke:#5A5A60;stroke-width:0.5;"/><path d="M454,442.2412 L454,450.2412 A2,2 0 0 0 456,452.2412 L464,452.2412 L454,442.2412" fill="#2F2A1C" style="stroke:#5A5A60;stroke-width:0.5;"/><text fill="#E6E6E8" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="307.271" x="142" y="459.835">The disco hosts nothing, and anyone can run one.</text><text fill="#E6E6E8" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="248.2251" x="142" y="475.5645">It is a future milestone; until then a client</text><text fill="#E6E6E8" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="229.7979" x="142" y="491.2939">goes straight to the hosting MUPPET.</text><path d="M5,513.4297 L5,562.4297 A4,4 0 0 0 9,566.4297 L569,566.4297 A4,4 0 0 0 573,562.4297 L573,519.4297 L563,509.4297 L9,509.4297 A4,4 0 0 0 5,513.4297" fill="#2F2A1C" style="stroke:#5A5A60;stroke-width:0.5;"/><path d="M563,509.4297 L563,517.4297 A2,2 0 0 0 565,519.4297 L573,519.4297 L563,509.4297" fill="#2F2A1C" style="stroke:#5A5A60;stroke-width:0.5;"/><text fill="#E6E6E8" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="352.8472" x="80.5986" y="527.0234">{ref} is @origin (an ordinary website as it is now), @main,</text><text fill="#E6E6E8" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="408.0273" x="80.5986" y="542.7529">a session name, or a state vector. The last @ always starts the ref;</text><text fill="#E6E6E8" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="235.9487" x="80.5986" y="558.4824">a bare URL redirects to the default ref.</text></g></svg>