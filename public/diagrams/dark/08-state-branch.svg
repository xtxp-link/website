<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="STATE" height="716px" preserveAspectRatio="none" style="width:544px;height:716px;" version="1.1" viewBox="0 0 544 716" width="544px" zoomAndPan="magnify"><title>Branch lifecycle (draft)</title><defs/><g><g class="title" data-source-line="2"><text fill="#E6E6E8" font-family="Helvetica" font-size="16" font-weight="bold" lengthAdjust="spacing" textLength="180.3828" x="175.2686" y="25.5">Branch lifecycle (draft)</text></g><ellipse cx="445" cy="56.3594" fill="#E6E6E8" rx="10" ry="10" style="stroke:#8F8F95;stroke-width:1;"/><g id="Forked"><rect fill="#232326" height="50" rx="4" ry="4" style="stroke:#5A5A60;stroke-width:0.5;" width="63.0371" x="413.5" y="153.8594"/><line style="stroke:#5A5A60;stroke-width:0.5;" x1="413.5" x2="476.5371" y1="179.5889" y2="179.5889"/><text fill="#A0A0A6" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="43.0371" x="423.5" y="171.4531">Forked</text></g><g id="Active"><rect fill="#232326" height="50" rx="4" ry="4" style="stroke:#5A5A60;stroke-width:0.5;" width="58.6826" x="192.5" y="291.3594"/><line style="stroke:#5A5A60;stroke-width:0.5;" x1="192.5" x2="251.1826" y1="317.0889" y2="317.0889"/><text fill="#A0A0A6" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="38.6826" x="202.5" y="308.9531">Active</text></g><g id="Paused"><rect fill="#232326" height="50" rx="4" ry="4" style="stroke:#5A5A60;stroke-width:0.5;" width="65.6904" x="31" y="153.8594"/><line style="stroke:#5A5A60;stroke-width:0.5;" x1="31" x2="96.6904" y1="179.5889" y2="179.5889"/><text fill="#A0A0A6" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="45.6904" x="41" y="171.4531">Paused</text></g><g id="Proposed"><rect fill="#232326" height="67.1885" rx="4" ry="4" style="stroke:#5A5A60;stroke-width:0.5;" width="161.4194" x="72.5" y="417.3594"/><line style="stroke:#5A5A60;stroke-width:0.5;" x1="72.5" x2="233.9194" y1="443.0889" y2="443.0889"/><text fill="#A0A0A6" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="59.1475" x="123.636" y="434.9531">Proposed</text><text fill="#A0A0A6" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="134.8242" x="77.5" y="460.6826">onion skin and redline</text><text fill="#A0A0A6" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="141.4194" x="77.5" y="476.4121">rendered for reviewers</text></g><g id="Merged"><rect fill="#232326" height="67.1885" rx="4" ry="4" style="stroke:#5A5A60;stroke-width:0.5;" width="187.9209" x="7" y="560.3594"/><line style="stroke:#5A5A60;stroke-width:0.5;" x1="7" x2="194.9209" y1="586.0889" y2="586.0889"/><text fill="#A0A0A6" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="47.728" x="77.0964" y="577.9531">Merged</text><text fill="#A0A0A6" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="80.374" x="12" y="603.6826">ops are kept,</text><text fill="#A0A0A6" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="167.9209" x="12" y="619.4121">so the branch is still history</text></g><g id="Abandoned"><rect fill="#232326" height="67.1885" rx="4" ry="4" style="stroke:#5A5A60;stroke-width:0.5;" width="154.7163" x="230.5" y="560.3594"/><line style="stroke:#5A5A60;stroke-width:0.5;" x1="230.5" x2="385.2163" y1="586.0889" y2="586.0889"/><text fill="#A0A0A6" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="70.8843" x="272.416" y="577.9531">Abandoned</text><text fill="#A0A0A6" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="94.269" x="235.5" y="603.6826">kept as history;</text><text fill="#A0A0A6" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="134.7163" x="235.5" y="619.4121">can be re-forked later</text></g><ellipse cx="204" cy="699.3594" fill="none" rx="11" ry="11" style="stroke:#E6E6E8;stroke-width:1;"/><ellipse cx="204" cy="699.3594" fill="#222222" rx="6" ry="6" style="stroke:#E6E6E8;stroke-width:1;"/><g class="entity" data-entity="GMN2" data-source-line="22" data-uid="ent0003" id="entity_GMN2"><path d="M132,146.3594 L132,174.8594 L97.2,178.8594 L132,182.8594 L132,211.2773 A4,4 0 0 0 136,215.2773 L374.4751,215.2773 A4,4 0 0 0 378.4751,211.2773 L378.4751,152.3594 L368.4751,142.3594 L136,142.3594 A4,4 0 0 0 132,146.3594" fill="#2F2A1C" style="stroke:#5A5A60;stroke-width:0.5;"/><path d="M368.4751,142.3594 L368.4751,150.3594 A2,2 0 0 0 370.4751,152.3594 L378.4751,152.3594 L368.4751,142.3594" fill="#2F2A1C" style="stroke:#5A5A60;stroke-width:0.5;"/><text fill="#E6E6E8" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="203.8232" x="138" y="159.9531">A paused queue is a local branch</text><text fill="#E6E6E8" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="225.4751" x="138" y="175.6826">that isn't upstreaming. Its edits show</text><text fill="#E6E6E8" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="214.043" x="138" y="191.4121">as a translucent preview; releasing</text><text fill="#E6E6E8" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="141.1528" x="138" y="207.1416">it is an ordinary merge.</text></g><!--link *start* to Forked--><g class="link" data-entity-1=".start." data-entity-2="Forked" data-source-line="4" data-uid="lnk4" id="link_.start._Forked"><path d="M445,66.4194 C445,84.6994 445,120.5494 445,147.4494" fill="none" id="*start*-to-Forked" style="stroke:#8F8F95;stroke-width:1.2;"/><polygon fill="#8F8F95" points="445,153.4494,449,144.4494,445,148.4494,441,144.4494,445,153.4494" style="stroke:#8F8F95;stroke-width:1.2;"/><text fill="#A0A0A6" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="90.9199" x="446" y="108.9844">fork(parent, SV)</text></g><!--link Forked to Active--><g class="link" data-entity-1="Forked" data-entity-