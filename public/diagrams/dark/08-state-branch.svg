<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="STATE" height="716px" preserveAspectRatio="none" style="width:597px;height:716px;" version="1.1" viewBox="0 0 597 716" width="597px" zoomAndPan="magnify"><title>Branch lifecycle (draft)</title><defs/><g><g class="title" data-source-line="2"><text fill="#E6E6E8" font-family="Helvetica" font-size="16" font-weight="bold" lengthAdjust="spacing" textLength="180.3828" x="201.7686" y="25.5">Branch lifecycle (draft)</text></g><ellipse cx="498" cy="56.3594" fill="#E6E6E8" rx="10" ry="10" style="stroke:#8F8F95;stroke-width:1;"/><g id="Forked"><rect fill="#232326" height="50" rx="4" ry="4" style="stroke:#5A5A60;stroke-width:0.5;" width="63.0371" x="466.5" y="153.8594"/><line style="stroke:#5A5A60;stroke-width:0.5;" x1="466.5" x2="529.5371" y1="179.5889" y2="179.5889"/><text fill="#A0A0A6" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="43.0371" x="476.5" y="171.4531">Forked</text></g><g id="Active"><rect fill="#232326" height="50" rx="4" ry="4" style="stroke:#5A5A60;stroke-width:0.5;" width="58.6826" x="192.5" y="291.3594"/><line style="stroke:#5A5A60;stroke-width:0.5;" x1="192.5" x2="251.1826" y1="317.0889" y2="317.0889"/><text fill="#A0A0A6" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="38.6826" x="202.5" y="308.9531">Active</text></g><g id="Paused"><rect fill="#232326" height="50" rx="4" ry="4" style="stroke:#5A5A60;stroke-width:0.5;" width="65.6904" x="34" y="153.8594"/><line style="stroke:#5A5A60;stroke-width:0.5;" x1="34" x2="99.6904" y1="179.5889" y2="179.5889"/><text fill="#A0A0A6" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="45.6904" x="44" y="171.4531">Paused</text></g><g id="Proposed"><rect fill="#232326" height="67.1885" rx="4" ry="4" style="stroke:#5A5A60;stroke-width:0.5;" width="161.4194" x="72.5" y="417.3594"/><line style="stroke:#5A5A60;stroke-width:0.5;" x1="72.5" x2="233.9194" y1="443.0889" y2="443.0889"/><text fill="#A0A0A6" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="59.1475" x="123.636" y="434.9531">Proposed</text><text fill="#A0A0A6" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="134.8242" x="77.5" y="460.6826">onion skin and redline</text><text fill="#A0A0A6" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="141.4194" x="77.5" y="476.4121">rendered for reviewers</text></g><g id="Merged"><rect fill="#232326" height="67.1885" rx="4" ry="4" style="stroke:#5A5A60;stroke-width:0.5;" width="187.9209" x="7" y="560.3594"/><line style="stroke:#5A5A60;stroke-width:0.5;" x1="7" x2="194.9209" y1="586.0889" y2="586.0889"/><text fill="#A0A0A6" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="47.728" x="77.0964" y="577.9531">Merged</text><text fill="#A0A0A6" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="80.374" x="12" y="603.6826">ops are kept,</text><text fill="#A0A0A6" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="167.9209" x="12" y="619.4121">so the branch is still history</text></g><g id="Abandoned"><rect fill="#232326" height="67.1885" rx="4" ry="4" style="stroke:#5A5A60;stroke-width:0.5;" width="154.7163" x="230.5" y="560.3594"/><line style="stroke:#5A5A60;stroke-width:0.5;" x1="230.5" x2="385.2163" y1="586.0889" y2="586.0889"/><text fill="#A0A0A6" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="70.8843" x="272.416" y="577.9531">Abandoned</text><text fill="#A0A0A6" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="94.269" x="235.5" y="603.6826">kept as history;</text><text fill="#A0A0A6" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="134.7163" x="235.5" y="619.4121">can be re-forked later</text></g><ellipse cx="204" cy="699.3594" fill="none" rx="11" ry="11" style="stroke:#E6E6E8;