<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="ACTIVITY" height="961px" preserveAspectRatio="none" style="width:460px;height:961px;" version="1.1" viewBox="0 0 460 961" width="460px" zoomAndPan="magnify"><title>Cycle-safe tree moves (after Evan Wallace)</title><defs/><g><g class="title" data-source-line="2"><text fill="#1D2330" font-family="Helvetica" font-size="16" font-weight="bold" lengthAdjust="spacing" textLength="340.25" x="58.5829" y="35.5">Cycle-safe tree moves (after Evan Wallace)</text></g><rect fill="none" height="285.6475" rx="4" ry="4" style="stroke:#9AA3B2;stroke-width:1.5;" width="251.6182" x="44.3772" y="51.3594"/><path d="M146.9641,51.3594 L146.9641,60.0889 L136.9641,70.0889 L44.3772,70.0889" fill="none" style="stroke:#9AA3B2;stroke-width:1.5;"/><text fill="#1D2330" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="92.5869" x="47.3772" y="64.9531">Writing a move</text><ellipse cx="170.1863" cy="90.0889" fill="#1D2330" rx="10" ry="10" style="stroke:#5C6577;stroke-width:1;"/><rect fill="#F6F7F9" height="35.7295" rx="4" ry="4" style="stroke:#9AA3B2;stroke-width:0.5;" width="173.4609" x="83.4558" y="120.0889"/><text fill="#1D2330" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="153.4609" x="93.4558" y="142.6826">move(node, new_parent)</text><rect fill="#F6F7F9" height="35.7295" rx="4" ry="4" style="stroke:#9AA3B2;stroke-width:0.5;" width="230.355" x="55.0088" y="175.8184"/><text fill="#1D2330" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="210.355" x="65.0088" y="198.4121">c = highest counter in node.edges</text><rect fill="#F6F7F9" height="51.459" rx="4" ry="4" style="stroke:#9AA3B2;stroke-width:0.5;" width="231.6182" x="54.3772" y="231.5479"/><text fill="#1D2330" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="198.231" x="64.3772" y="254.1416">node.edges[new_parent] = c + 1</text><text fill="#1D2330" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="211.6182" x="64.3772" y="269.8711">(a plain map write; old edges stay)</text><ellipse cx="170.1863" cy="314.0068" fill="none" rx="11" ry="11" style="stroke:#5C6577;stroke-width:1;"/><ellipse cx="170.1863" cy="314.0068" fill="#222222" rx="6" ry="6" style="stroke:#5C6577;stroke-width:1;"/><rect fill="none" height="603.2559" rx="4" ry="4" style="stroke:#9AA3B2;stroke-width:1.5;" width="438.4158" x="11" y="347.0068"/><path d="M269.1108,347.0068 L269.1108,355.7363 L259.1108,365.7363 L11,365.7363" fill="none" style="stroke:#9AA3B2;stroke-width:1.5;"/><text fill="#1D2330" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="248.1108" x="14" y="360.6006">Reading the tree (every peer, same rule)</text><ellipse cx="170.1863" cy="385.7363" fill="#1D2330" rx="10" ry="10" style="stroke:#5C6577;stroke-width:1;"/><rect fill="#F6F7F9" height="51.459" rx="4" ry="4" style="stroke:#9AA3B2;stroke-width:0.5;" width="236.2329" x="52.0698" y="415.7363"/><text fill="#1D2330" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="209.2759" x="62.0698" y="438.3301">for each node, parent = edge with</text><text fill="#1D2330" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="216.2329" x="62.0698" y="454.0596">the highest counter (ID breaks ties)</text><rect fill="#F6F7F9" height="51.459" rx="4" ry="4" style="stroke:#9AA3B2;stroke-width:0.5;" width="175.1367" x="82.6179" y="487.1953"/><text fill="#1D2330" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="155.1367" x="92.6179" y="509.7891">nodes that reach the root</text><text fill="#1D2330" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="80.0249" x="92.6179" y="525.5186">form the tree</text><rect fill="#F6F7F9" height="67.1885" rx="4" ry="4" style="stroke:#9AA3B2;stroke-width:0.5;" width="262.3726" x="39" y="623.2383"/><text fill="#1D2330" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="228.103" x="49" y="645.832">pick the next node and an edge to an</text><text fill="#1D2330" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="242.3726" x="49" y="661.5615">already-rooted parent: highest counter,</text><text fill="#1D2330" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="83.7573" x="49" y="677.291">IDs break ties</text><rect fill="#F6F7F9" height="51.459" rx="4" ry="4" style="stroke:#9AA3B2;stroke-width:0.5;" width="237.585" x="51.3938" y="710.4268"/><text fill="#1D2330" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="97.3984" x="61.3938" y="733.0205">reattach it there</text><text fill="#1D2330" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="217.585" x="61.3938" y="748.75">(view only: stored data unchanged)</text><polygon fill="#E3F0FC" points="101.2952,558.6543,239.0774,558.6543,251.0774,574.3838,239.0774,590.1133,101.2952,590.1133,89.2952,574.3838,101.2952,558.6543" style="stroke:#1565C0;stroke-width:0.5;"/><text fill="#5C6577" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="20.0742" x="174.1863" y="601.7383">yes</text><text fill="#1D2330" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="137.7822" x="101.2952" y="571.248">any nodes not rooted?</text><text fill="#1D2330" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="121.7227" x="101.2952" y="586.9775">(they are in a cycle)</text><text fill="#5C6577" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="14.2852" x="75.01" y="571.4893">no</text><rect fill="#F6F7F9" height="35.7295" rx="4" ry="4" style="stroke:#9AA3B2;stroke-width:0.5;" width="221.0176" x="59.6775" y="803.8857"/><text fill="#1D2330" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="201.0176" x="69.6775" y="826.4795">order siblings by fractional index</text><path d="M201.1863,849.6152 L201.1863,889.939 L181.1863,893.939 L201.1863,897.939 L201.1863,938.2627 A0,0 0 0 0 201.1863,938.2627 L439.4158,938.2627 A0,0 0 0 0 439.4158,938.2627 L439.4158,859.6152 L429.4158,849.6152 L201.1863,849.6152 A0,0 0 0 0 201.1863,849.6152" fill="#FFFBEA" style="stroke:#9AA3B2;stroke-width:0.5;"/><path d="M429.4158,849.6152 L429.4158,859.6152 L439.4158,859.6152 L429.4158,849.6152" fill="#FFFBEA" style="stroke:#9AA3B2;stroke-width:0.5;"/><text fill="#1D2330" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="217.2295" x="207.1863" y="867.209">The same converged maps and the</text><text fill="#1D2330" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="196.8091" x="207.1863" y="882.9385">same rule give the same tree on</text><text fill="#1D2330" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="70.0781" x="207.1863" y="898.668">every peer.</text><text fill="#1D2330" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="181.1621" x="207.1863" y="914.3975">Nothing is rewritten, so peers</text><text fill="#1D2330" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="143.4316" x="207.1863" y="930.127">never fight over the fix.</text><ellipse cx="170.1863" cy="893.939" fill="none" rx="11" ry="11" style="stroke:#5C6577;stroke-width:1;"/><ellipse cx="170.1863" cy="893.939" fill="#222222" rx="6" ry="6" style="stroke:#5C6577;stroke-width:1;"/><line style="stroke:#5C6577;stroke-width:1.2;" x1="170.1863" x2="170.1863" y1="100.0889" y2="120.0889"/><polygon fill="#5C6577" points="166.1863,110.0889,170.1863,120.0889,174.1863,110.0889,170.1863,114.0889" style="stroke:#5C6577;stroke-width:1;"/><line style="stroke:#5C6577;stroke-width:1.2;" x1="170.1863" x2="170.1863" y1="155.8184" y2="175.8184"/><polygon fill="#5C6577" points="166.1863,165.8184,170.1863,175.8184,174.1863,165.8184,170.1863,169.8184" style="stroke:#5C6577;stroke-width:1;"/><line style="stroke:#5C6577;stroke-width:1.2;" x1="170.1863" x2="170.1863" y1="211.5479" y2="231.5479"/><polygon fill="#5C6577" points="166.1863,221.5479,170.1863,231.5479,174.1863,221.5479,170.1863,225.5479" style="stroke:#5C6577;stroke-width:1;"/><line style="stroke:#5C6577;stroke-width:1.2;" x1="170.1863" x2="170.1863" y1="283.0068" y2="303.0068"/><polygon fill="#5C6577" points="166.1863,293.0068,170.1863,303.0068,174.1863,293.0068,170.1863,297.0068" style="stroke:#5C6577;stroke-width:1;"/><line style="stroke:#5C6577;stroke-width:1.2;" x1="170.1863" x2="170.1863" y1="395.7363" y2="415.7363"/><polygon fill="#5C6577" points="166.1863,405.7363,170.1863,415.7363,174.1863,405.7363,170.1863,409.7363" style="stroke:#5C6577;stroke-width:1;"/><line style="stroke:#5C6577;stroke-width:1.2;" x1="170.1863" x2="170.1863" y1="467.1953" y2="487.1953"/><polygon fill="#5C6577" points="166.1863,477.1953,170.1863,487.1953,174.1863,477.1953,170.1863,481.1953" style="stroke:#5C6577;stroke-width:1;"/><line style="stroke:#5C6577;stroke-width:1.2;" x1="170.1863" x2="170.1863" y1="690.4268" y2="710.4268"/><polygon fill="#5C6577" points="166.1863,700.4268,170.1863,710.4268,174.1863,700.4268,170.1863,704.4268" style="stroke:#5C6577;stroke-width:1;"/><line style="stroke:#5C6577;stroke-width:1.2;" x1="170.1863" x2="170.1863" y1="590.1133" y2="623.2383"/><polygon fill="#5C6577" points="166.1863,613.2383,170.1863,623.2383,174.1863,613.2383,170.1863,617.2383" style="stroke:#5C6577;stroke-width:1;"/><line style="stroke:#5C6577;stroke-width:1.2;" x1="170.1863" x2="170.1863" y1="761.8857" y2="771.8857"/><line style="stroke:#5C6577;stroke-width:1.2;" x1="170.1863" x2="313.3726" y1="771.8857" y2="771.8857"/><polygon fill="#5C6577" points="309.3726,688.9375,313.3726,678.9375,317.3726,688.9375,313.3726,684.9375" style="stroke:#5C6577;stroke-width:1.2;"/><line style="stroke:#5C6577;stroke-width:1.2;" x1="313.3726" x2="313.3726" y1="574.3838" y2="771.8857"/><line style="stroke:#5C6577;stroke-width:1.2;" x1="313.3726" x2="251.0774" y1="574.3838" y2="574.3838"/><polygon fill="#5C6577" points="261.0774,570.3838,251.0774,574.3838,261.0774,578.3838,257.0774,574.3838" style="stroke:#5C6577;stroke-width:1;"/><line style="stroke:#5C6577;stroke-width:1.2;" x1="89.2952" x2="27" y1="574.3838" y2="574.3838"/><polygon fill="#5C6577" points="23,674.9375,27,684.9375,31,674.9375,27,678.9375" style="stroke:#5C6577;stroke-width:1.2;"/><line style="stroke:#5C6577;stroke-width:1.2;" x1="27" x2="27" y1="574.3838" y2="783.8857"/><line style="stroke:#5C6577;stroke-width:1.2;" x1="27" x2="170.1863" y1="783.8857" y2="783.8857"/><line style="stroke:#5C6577;stroke-width:1.2;" x1="170.1863" x2="170.1863" y1="783.8857" y2="803.8857"/><polygon fill="#5C6577" points="166.1863,793.8857,170.1863,803.8857,174.1863,793.8857,170.1863,797.8857" style="stroke:#5C6577;stroke-width:1;"/><line style="stroke:#5C6577;stroke-width:1.2;" x1="170.1863" x2="170.1863" y1="538.6543" y2="558.6543"/><polygon fill="#5C6577" points="166.1863,548.6543,170.1863,558.6543,174.1863,548.6543,170.1863,552.6543" style="stroke:#5C6577;stroke-width:1;"/><line style="stroke:#5C6577;stroke-width:1.2;" x1="170.1863" x2="170.1863" y1="839.6152" y2="882.939"/><polygon fill="#5C6577" points="166.1863,872.939,170.1863,882.939,174.1863,872.939,170.1863,876.939" style="stroke:#5C6577;stroke-width:1;"/></g></svg>