<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="ACTIVITY" height="584px" preserveAspectRatio="none" style="width:579px;height:584px;" version="1.1" viewBox="0 0 579 584" width="579px" zoomAndPan="magnify"><title>Applying a tree move safely (after Kleppmann et al.)</title><defs/><g><g class="title" data-source-line="2"><text fill="#1D2330" font-family="Helvetica" font-size="16" font-weight="bold" lengthAdjust="spacing" textLength="406.5313" x="85.2214" y="35.5">Applying a tree move safely (after Kleppmann et al.)</text></g><ellipse cx="257.1992" cy="60.3594" fill="#1D2330" rx="10" ry="10" style="stroke:#5C6577;stroke-width:1;"/><rect fill="#F6F7F9" height="35.7295" rx="4" ry="4" style="stroke:#9AA3B2;stroke-width:0.5;" width="234.2842" x="140.0571" y="90.3594"/><text fill="#1D2330" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="214.2842" x="150.0571" y="112.9531">receive move(t, node, new_parent)</text><rect fill="#F6F7F9" height="35.7295" rx="4" ry="4" style="stroke:#9AA3B2;stroke-width:0.5;" width="206.6211" x="153.8887" y="195.3486"/><text fill="#1D2330" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="186.6211" x="163.8887" y="217.9424">undo applied ops newer than t</text><polygon fill="#E3F0FC" points="154.7703,146.0889,359.6282,146.0889,371.6282,158.0889,359.6282,170.0889,154.7703,170.0889,142.7703,158.0889,154.7703,146.0889" style="stroke:#1565C0;stroke-width:0.5;"/><text fill="#5C6577" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="20.0742" x="261.1992" y="181.7139">yes</text><text fill="#1D2330" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="204.8579" x="154.7703" y="162.8179">t older than the latest applied op?</text><text fill="#5C6577" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="14.2852" x="371.6282" y="155.1943">no</text><polygon fill="#E3F0FC" points="257.1992,251.0781,269.1992,263.0781,257.1992,275.0781,245.1992,263.0781,257.1992,251.0781" style="stroke:#1565C0;stroke-width:0.5;"/><polygon fill="#E3F0FC" points="139.6152,295.0781,374.7832,295.0781,386.7832,310.8076,374.7832,326.5371,139.6152,326.5371,127.6152,310.8076,139.6152,295.0781" style="stroke:#1565C0;stroke-width:0.5;"/><text fill="#1D2330" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="127.0229" x="139.6152" y="307.6719">node == new_parent</text><text fill="#1D2330" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="235.168" x="139.6152" y="323.4014">or node is an ancestor of new_parent?</text><text fill="#5C6577" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="117.6152" x="10" y="307.9131">would create a cycle</text><text fill="#5C6577" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="24.5098" x="386.7832" y="307.9131">safe</text><rect fill="#F6F7F9" height="35.7295" rx="4" ry="4" style="stroke:#9AA3B2;stroke-width:0.5;" width="191.0884" x="22.071" y="336.5371"/><text fill="#1D2330" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="171.0884" x="32.071" y="359.1309">record the move as a no-op</text><rect fill="#F6F7F9" height="35.7295" rx="4" ry="4" style="stroke:#9AA3B2;stroke-width:0.5;" width="204.1836" x="294.6914" y="336.5371"/><text fill="#1D2330" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="184.1836" x="304.6914" y="359.1309">set node.parent = new_parent</text><polygon fill="#E3F0FC" points="257.1992,378.2666,269.1992,390.2666,257.1992,402.2666,245.1992,390.2666,257.1992,378.2666" style="stroke:#1565C0;stroke-width:0.5;"/><rect fill="#F6F7F9" height="51.459" rx="4" ry="4" style="stroke:#9AA3B2;stroke-width:0.5;" width="270.5103" x="121.9441" y="422.2666"/><text fill="#1D2330" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="250.5103" x="131.9441" y="444.8604">redo the undone ops in timestamp order,</text><text fill="#1D2330" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="234.7427" x="131.9441" y="460.5898">re-checking each move the same way</text><path d="M288.1992,483.7256 L288.1992,524.0493 L268.1992,528.0493 L288.1992,532.0493 L288.1992,572.373 A0,0 0 0 0 288.1992,572.373 L567.9741,572.373 A0,0 0 0 0 567.9741,572.373 L567.9741,493.7256 L557.9741,483.7256 L288.1992,483.7256 A0,0 0 0 0 288.1992,483.7256" fill="#FFFBEA" style="stroke:#9AA3B2;stroke-width:0.5;"/><path d="M557.9741,483.7256 L557.9741,493.7256 L567.9741,493.7256 L557.9741,483.7256" fill="#FFFBEA" style="stroke:#9AA3B2;stroke-width:0.5;"/><text fill="#1D2330" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="246.6572" x="294.1992" y="501.3193">Every replica applies moves in the same</text><text fill="#1D2330" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="242.0234" x="294.1992" y="517.0488">timestamp order, so every replica skips</text><text fill="#1D2330" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="258.7749" x="294.1992" y="532.7783">the same moves. The move skipped is the</text><text fill="#1D2330" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="247.7935" x="294.1992" y="548.5078">one that would close the cycle given the</text><text fill="#1D2330" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="211.561" x="294.1992" y="564.2373">earlier ones, not "the older intent".</text><ellipse cx="257.1992" cy="528.0493" fill="none" rx="11" ry="11" style="stroke:#5C6577;stroke-width:1;"/><ellipse cx="257.1992" cy="528.0493" fill="#222222" rx="6" ry="6" style="stroke:#5C6577;stroke-width:1;"/><line style="stroke:#5C6577;stroke-width:1.2;" x1="257.1992" x2="257.1992" y1="70.3594" y2="90.3594"/><polygon fill="#5C6577" points="253.1992,80.3594,257.1992,90.3594,261.1992,80.3594,257.1992,84.3594" style="stroke:#5C6577;stroke-width:1;"/><line style="stroke:#5C6577;stroke-width:1.2;" x1="257.1992" x2="257.1992" y1="170.0889" y2="195.3486"/><polygon fill="#5C6577" points="253.1992,185.3486,257.1992,195.3486,261.1992,185.3486,257.1992,189.3486" style="stroke:#5C6577;stroke-width:1;"/><line style="stroke:#5C6577;stroke-width:1.2;" x1="371.6282" x2="383.6282" y1="158.0889" y2="158.0889"/><polygon fill="#5C6577" points="379.6282,203.2134,383.6282,213.2134,387.6282,203.2134,383.6282,207.2134" style="stroke:#5C6577;stroke-width:1.2;"/><line style="stroke:#5C6577;stroke-width:1.2;" x1="383.6282" x2="383.6282" y1="158.0889" y2="263.0781"/><line style="stroke:#5C6577;stroke-width:1.2;" x1="383.6282" x2="269.1992" y1="263.0781" y2="263.0781"/><polygon fill="#5C6577" points="279.1992,259.0781,269.1992,263.0781,279.1992,267.0781,275.1992,263.0781" style="stroke:#5C6577;stroke-width:1;"/><line style="stroke:#5C6577;stroke-width:1.2;" x1="257.1992" x2="257.1992" y1="231.0781" y2="251.0781"/><polygon fill="#5C6577" points="253.1992,241.0781,257.1992,251.0781,261.1992,241.0781,257.1992,245.0781" style="stroke:#5C6577;stroke-width:1;"/><line style="stroke:#5C6577;stroke-width:1.2;" x1="257.1992" x2="257.1992" y1="126.0889" y2="146.0889"/><polygon fill="#5C6577" points="253.1992,136.0889,257.1992,146.0889,261.1992,136.0889,257.1992,140.0889" style="stroke:#5C6577;stroke-width:1;"/><line style="stroke:#5C6577;stroke-width:1.2;" x1="127.6152" x2="117.6152" y1="310.8076" y2="310.8076"/><line style="stroke:#5C6577;stroke-width:1.2;" x1="117.6152" x2="117.6152" y1="310.8076" y2="336.5371"/><polygon fill="#5C6577" points="113.6152,326.5371,117.6152,336.5371,121.6152,326.5371,117.6152,330.5371" style="stroke:#5C6577;stroke-width:1;"/><line style="stroke:#5C6577;stroke-width:1.2;" x1="386.7832" x2="396.7832" y1="310.8076" y2="310.8076"/><line style="stroke:#5C6577;stroke-width:1.2;" x1="396.7832" x2="396.7832" y1="310.8076" y2="336.5371"/><polygon fill="#5C6577" points="392.7832,326.5371,396.7832,336.5371,400.7832,326.5371,396.7832,330.5371" style="stroke:#5C6577;stroke-width:1;"/><line style="stroke:#5C6577;stroke-width:1.2;" x1="117.6152" x2="117.6152" y1="372.2666" y2="390.2666"/><line style="stroke:#5C6577;stroke-width:1.2;" x1="117.6152" x2="245.1992" y1="390.2666" y2="390.2666"/><polygon fill="#5C6577" points="235.1992,386.2666,245.1992,390.2666,235.1992,394.2666,239.1992,390.2666" style="stroke:#5C6577;stroke-width:1;"/><line style="stroke:#5C6577;stroke-width:1.2;" x1="396.7832" x2="396.7832" y1="372.2666" y2="390.2666"/><line style="stroke:#5C6577;stroke-width:1.2;" x1="396.7832" x2="269.1992" y1="390.2666" y2="390.2666"/><polygon fill="#5C6577" points="279.1992,386.2666,269.1992,390.2666,279.1992,394.2666,275.1992,390.2666" style="stroke:#5C6577;stroke-width:1;"/><line style="stroke:#5C6577;stroke-width:1.2;" x1="257.1992" x2="257.1992" y1="275.0781" y2="295.0781"/><polygon fill="#5C6577" points="253.1992,285.0781,257.1992,295.0781,261.1992,285.0781,257.1992,289.0781" style="stroke:#5C6577;stroke-width:1;"/><line style="stroke:#5C6577;stroke-width:1.2;" x1="257.1992" x2="257.1992" y1="402.2666" y2="422.2666"/><polygon fill="#5C6577" points="253.1992,412.2666,257.1992,422.2666,261.1992,412.2666,257.1992,416.2666" style="stroke:#5C6577;stroke-width:1;"/><line style="stroke:#5C6577;stroke-width:1.2;" x1="257.1992" x2="257.1992" y1="473.7256" y2="517.0493"/><polygon fill="#5C6577" points="253.1992,507.0493,257.1992,517.0493,261.1992,507.0493,257.1992,511.0493" style="stroke:#5C6577;stroke-width:1;"/></g></svg>