<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="SEQUENCE" height="646px" preserveAspectRatio="none" style="width:610px;height:646px;" version="1.1" viewBox="0 0 610 646" width="610px" zoomAndPan="magnify"><title>Discovery and content negotiation</title><defs/><g><text fill="#1C1C1F" font-family="Helvetica" font-size="16" font-weight="bold" lengthAdjust="spacing" textLength="269.3203" x="171.4521" y="30.5">Discovery and content negotiation</text><rect fill="none" height="193.8252" rx="4" ry="4" style="stroke:#9A9AA1;stroke-width:1.5;" width="593.2246" x="10" y="250.9355"/><g><title>Client</title><rect fill="#000000" fill-opacity="0.00000" height="504.3193" width="8" x="40.6528" y="91.8184"/><line style="stroke:#9A9AA1;stroke-width:0.5;stroke-dasharray:5,5;" x1="44" x2="44" y1="91.8184" y2="596.1377"/></g><g><title>Muppet disco</title><rect fill="#000000" fill-opacity="0.00000" height="504.3193" width="8" x="296.5376" y="91.8184"/><line style="stroke:#9A9AA1;stroke-width:0.5;stroke-dasharray:5,5;" x1="300.5225" x2="300.5225" y1="91.8184" y2="596.1377"/></g><g><title>Hosting MUPPET</title><rect fill="#000000" fill-opacity="0.00000" height="504.3193" width="8" x="529.5962" y="91.8184"/><line style="stroke:#9A9AA1;stroke-width:0.5;stroke-dasharray:5,5;" x1="532.9678" x2="532.9678" y1="91.8184" y2="596.1377"/></g><g class="participant participant-head" data-participant="c"><rect fill="#F6F6F7" height="29.7295" rx="4" ry="4" style="stroke:#9A9AA1;stroke-width:0.5;" width="49.3057" x="20" y="61.0889"/><text fill="#1C1C1F" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="35.3057" x="27" y="80.6826">Client</text></g><g class="participant participant-tail" data-participant="c"><rect fill="#F6F6F7" height="29.7295" rx="4" ry="4" style="stroke:#9A9AA1;stroke-width:0.5;" width="49.3057" x="20" y="595.1377"/><text fill="#1C1C1F" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="35.3057" x="27" y="614.7314">Client</text></g><g class="participant participant-head" data-participant="gw"><rect fill="#F6F6F7" height="45.459" rx="4" ry="4" style="stroke:#9A9AA1;stroke-width:0.5;" width="98.0303" x="251.5225" y="45.3594"/><text fill="#1C1C1F" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="84.0303" x="258.5225" y="64.9531">Muppet disco</text><text fill="#1C1C1F" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="60.7471" x="270.1641" y="80.6826">(xtxp.link)</text></g><g class="participant participant-tail" data-participant="gw"><rect fill="#F6F6F7" height="45.459" rx="4" ry="4" style="stroke:#9A9AA1;stroke-width:0.5;" width="98.0303" x="251.5225" y="595.1377"/><text fill="#1C1C1F" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="84.0303" x="258.5225" y="614.7314">Muppet disco</text><text fill="#1C1C1F" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="60.7471" x="270.1641" y="630.4609">(xtxp.link)</text></g><g class="participant participant-head" data-participant="node"><rect fill="#F6F6F7" height="29.7295" rx="4" ry="4" style="stroke:#9A9AA1;stroke-width:0.5;" width="119.2568" x="473.9678" y="61.0889"/><text fill="#1C1C1F" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="105.2568" x="480.9678" y="80.6826">Hosting MUPPET</text></g><g class="participant participant-tail" data-participant="node"><rect fill="#F6F6F7" height="29.7295" rx="4" ry="4" style="stroke:#9A9AA1;stroke-width:0.5;" width="119.2568" x="473.9678" y="595.1377"/><text fill="#1C1C1F" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="105.2568" x="480.9678" y="614.7314">Hosting MUPPET</text></g><g class="message" data-participant-1="c" data-participant-2="gw"><polygon fill="#5C5C63" points="288.5376,132.8574,298.5376,136.8574,288.5376,140.8574,292.5376,136.8574" style="stroke:#5C5C63;stroke-width:1;"/><line style="stroke:#5C5C63;stroke-width:1.2;" x1="44.6528" x2="294.5376" y1="136.8574" y2="136.8574"/><text fill="#5C5C63" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="231.8848" x="51.6528" y="117.4434">GET https://xtxp.link/{host}/{path}@{ref}</text><text fill="#5C5C63" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="200.7246" x="51.6528" y="131.9629">(+ query signed by the client's key)</text></g><g class="message" data-participant-1="gw" data-participant-2="gw"><line style="stroke:#5C5C63;stroke-width:1.2;" x1="300.5376" x2="342.5376" y1="179.8965" y2="179.8965"/><line style="stroke:#5C5C63;stroke-width:1.2;" x1="342.5376" x2="342.5376" y1="179.8965" y2="192.8965"/><line style="stroke:#5C5C63;stroke-width:1.2;" x1="301.5376" x2="342.5376" y1="192.8965" y2="192.8965"/><polygon fill="#5C5C63" points="311.5376,188.8965,301.5376,192.8965,311.5376,196.8965,307.5376,192.8965" style="stroke:#5C5C63;stroke-width:1;"/><text fill="#5C5C63" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="174.3633" x="307.5376" y="160.4824">which MUPPETs host sessions</text><text fill="#5C5C63" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="219.0586" x="307.5376" y="175.002">of {host}/{path} that this key may see?</text></g><g class="message" data-participant-1="gw" data-participant-2="c"><polygon fill="#5C5C63" points="55.6528,231.9355,45.6528,235.9355,55.6528,239.9355,51.6528,235.9355" style="stroke:#5C5C63;stroke-width:1;"/><line style="stroke:#5C5C63;stroke-width:1.2;stroke-dasharray:2,2;" x1="49.6528" x2="299.5376" y1="235.9355" y2="235.9355"/><text fill="#5C5C63" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="157.3242" x="61.6528" y="216.5215">303 &#8594; the hosting MUPPET</text><text fill="#5C5C63" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="157.4531" x="61.6528" y="231.041">(or a list of visible sessions)</text></g><path d="M14,250.9355 L70.8311,250.9355 L70.8311,258.665 L60.8311,268.665 L10,268.665 L10,254.9355 A4,4 0 0 1 14,250.9355" fill="#ECECEE" style="stroke:#9A9AA1;stroke-width:1.5;"/><rect fill="none" height="193.8252" rx="4" ry="4" style="stroke:#9A9AA1;stroke-width:1.5;" width="593.2246" x="10" y="250.9355"/><text fill="#1C1C1F" font-family="Helvetica" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="15.8311" x="25" y="264.5293">alt</text><text fill="#1C1C1F" font-family="Helvetica" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="139.769" x="85.8311" y="265.5293">[WebSocket upgrade]</text><g class="message" data-participant-1="c" data-participant-2="node"><polygon fill="#5C5C63" points="521.5962,285.9141,531.5962,289.9141,521.5962,293.9141,525.5962,289.9141" style="stroke:#5C5C63;stroke-width:1;"/><line style="stroke:#5C5C63;stroke-width:1.2;" x1="44.6528" x2="527.5962" y1="289.9141" y2="289.9141"/><text fill="#5C5C63" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="130.6992" x="51.6528" y="285.0195">upgrade to WebSocket</text></g><g class="message" data-participant-1="node" data-participant-2="c"><polygon fill="#5C5C63" points="55.6528,328.9531,45.6528,332.9531,55.6528,336.9531,51.6528,332.9531" style="stroke:#5C5C63;stroke-width:1;"/><line style="stroke:#5C5C63;stroke-width:1.2;stroke-dasharray:2,2;" x1="49.6528" x2="532.5962" y1="332.9531" y2="332.9531"/><text fill="#5C5C63" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="77.6367" x="61.6528" y="313.5391">XTXP stream:</text><text fill="#5C5C63" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="174.5977" x="61.6528" y="328.0586">Yrs v1 updates in XTXP frames</text></g><line style="stroke:#9A9AA1;stroke-width:1;stroke-dasharray:2,2;" x1="10" x2="603.2246" y1="341.9531" y2="341.9531"/><text fill="#1C1C1F" font-family="Helvetica" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="121.0181" x="15" y="354.5469">[Accept: text/html]</text><g class="message" data-participant-1="c" data-participant-2="node"><polygon fill="#5C5C63" points="521.5962,375.2021,531.5962,379.2021,521.5962,383.2021,525.5962,379.2021" style="stroke:#5C5C63;stroke-width:1;"/><line style="stroke:#5C5C63;stroke-width:1.2;" x1="44.6528" x2="527.5962" y1="379.2021" y2="379.2021"/><text fill="#5C5C63" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="23.9121" x="51.6528" y="374.3076">GET</text></g><g class="message" data-participant-1="node" data-participant-2="c"><polygon fill="#5C5C63" points="55.6528,432.7607,45.6528,436.7607,55.6528,440.7607,51.6528,436.7607" style="stroke:#5C5C63;stroke-width:1;"/><line style="stroke:#5C5C63;stroke-width:1.2;stroke-dasharray:2,2;" x1="49.6528" x2="532.5962" y1="436.7607" y2="436.7607"/><text fill="#5C5C63" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="181.5879" x="61.6528" y="402.8271">rendered current state as HTML</text><text fill="#5C5C63" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="135.9199" x="61.6528" y="417.3467">+ forms that POST edits</text><text fill="#5C5C63" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="326.0859" x="61.6528" y="431.8662">+ link "open in native client" &#8594; xtxp://{host}/{path}@{ref}</text></g><path d="M136,460.7607 L136,509.7607 A4,4 0 0 0 140,513.7607 L460,513.7607 A4,4 0 0 0 464,509.7607 L464,466.7607 L454,456.7607 L140,456.7607 A4,4 0 0 0 136,460.7607" fill="#FFFBEA" style="stroke:#9A9AA1;stroke-width:0.5;"/><path d="M454,456.7607 L454,464.7607 A2,2 0 0 0 456,466.7607 L464,466.7607 L454,456.7607" fill="#FFFBEA" style="stroke:#9A9AA1;stroke-width:0.5;"/><text fill="#1C1C1F" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="307.271" x="142" y="474.3545">The disco hosts nothing, and anyone can run one.</text><text fill="#1C1C1F" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="248.2251" x="142" y="490.084">It is a future milestone; until then a client</text><text fill="#1C1C1F" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="229.7979" x="142" y="505.8135">goes straight to the hosting MUPPET.</text><path d="M5,527.9492 L5,576.9492 A4,4 0 0 0 9,580.9492 L569,580.9492 A4,4 0 0 0 573,576.9492 L573,533.9492 L563,523.9492 L9,523.9492 A4,4 0 0 0 5,527.9492" fill="#FFFBEA" style="stroke:#9A9AA1;stroke-width:0.5;"/><path d="M563,523.9492 L563,531.9492 A2,2 0 0 0 565,533.9492 L573,533.9492 L563,523.9492" fill="#FFFBEA" style="stroke:#9A9AA1;stroke-width:0.5;"/><text fill="#1C1C1F" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="352.8472" x="80.5986" y="541.543">{ref} is @origin (an ordinary website as it is now), @main,</text><text fill="#1C1C1F" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="408.0273" x="80.5986" y="557.2725">a session name, or a state vector. The last @ always starts the ref;</text><text fill="#1C1C1F" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="235.9487" x="80.5986" y="573.002">a bare URL redirects to the default ref.</text></g></svg>