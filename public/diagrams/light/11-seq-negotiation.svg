nt participant-tail" data-participant="c"><rect fill="#F6F7F9" height="29.7295" rx="4" ry="4" style="stroke:#9AA3B2;stroke-width:0.5;" width="49.3057" x="20" y="510.0596"/><text fill="#1D2330" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="35.3057" x="27" y="529.6533">Client</text></g><g class="participant participant-head" data-participant="gw"><rect fill="#F6F7F9" height="45.459" rx="4" ry="4" style="stroke:#9AA3B2;stroke-width:0.5;" width="66.3491" x="361.5642" y="45.3594"/><text fill="#1D2330" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="51.2637" x="369.1069" y="64.9531">xtxp.link</text><text fill="#1D2330" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="52.3491" x="368.5642" y="80.6826">gateway</text></g><g class="participant participant-tail" data-participant="gw"><rect fill="#F6F7F9" height="45.459" rx="4" ry="4" style="stroke:#9AA3B2;stroke-width:0.5;" width="66.3491" x="361.5642" y="510.0596"/><text fill="#1D2330" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="51.2637" x="369.1069" y="529.6533">xtxp.link</text><text fill="#1D2330" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="52.3491" x="368.5642" y="545.3828">gateway</text></g><g class="participant participant-head" data-participant="dir"><rect fill="#F6F7F9" height="29.7295" rx="4" ry="4" style="stroke:#9AA3B2;stroke-width:0.5;" width="70.6782" x="533.0364" y="61.0889"/><text fill="#1D2330" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="56.6782" x="540.0364" y="80.6826">Directory</text></g><g class="participant participant-tail" data-participant="dir"><rect fill="#F6F7F9" height="29.7295" rx="4" ry="4" style="stroke:#9AA3B2;stroke-width:0.5;" width="70.6782" x="533.0364" y="510.0596"/><text fill="#1D2330" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="56.6782" x="540.0364" y="529.6533">Directory</text></g><g class="participant participant-head" data-participant="node"><rect fill="#F6F7F9" height="29.7295" rx="4" ry="4" style="stroke:#9AA3B2;stroke-width:0.5;" width="96.0435" x="613.7146" y="61.0889"/><text fill="#1D2330" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="82.0435" x="620.7146" y="80.6826">Hosting node</text></g><g class="participant participant-tail" data-participant="node"><rect fill="#F6F7F9" height="29.7295" rx="4" ry="4" style="stroke:#9AA3B2;stroke-width:0.5;" width="96.0435" x="613.7146" y="510.0596"/><text fill="#1D2330" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="82.0435" x="620.7146" y="529.6533">Hosting node</text></g><g class="message" data-participant-1="c" data-participant-2="gw"><polygon fill="#5C6577" points="382.7388,118.3379,392.7388,122.3379,382.7388,126.3379,386.7388,122.3379" style="stroke:#5C6577;stroke-width:1;"/><line style="stroke:#5C6577;stroke-width:1.2;" x1="44.6528" x2="388.7388" y1="122.3379" y2="122.3379"/><text fill="#5C6577" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="231.8848" x="51.6528" y="117.4434">GET https://xtxp.link/{host}/{path}@{ref}</text></g><g class="message" data-participant-1="gw" data-participant-2="dir"><polygon fill="#5C6577" points="556.3755,146.8574,566.3755,150.8574,556.3755,154.8574,560.3755,150.8574" style="stroke:#5C6577;stroke-width:1;"/><line style="stroke:#5C6577;stroke-width:1.2;" x1="394.7388" x2="562.3755" y1="150.8574" y2="150.8574"/><text fill="#5C6577" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="142.3242" x="401.7388" y="145.9629">who hosts {host}/{path}?</text></g><g class="message" data-participant-1="dir" data-participant-2="gw"><polygon fill="#5C6577" points="405.7388,189.8965,395.7388,193.8965,405.7388,197.8965,401.7388,193.8965" style="stroke:#5C6577;stroke-width:1;"/><line style="stroke:#5C6577;stroke-width:1.2;stroke-dasharray:2,2;" x1="399.7388" x2="567.3755" y1="193.8965" y2="193.8965"/><text fill="#5C6577" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="149.6367" x="411.7388" y="174.4824">hosting node + the branch</text><text fill="#5C6577" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="140.4082" x="411.7388" y="189.002">or vector named by {ref}</text></g><path d="M14,208.8965 L70.8311,208.8965 L70.8311,216.626 L60.8311,226.626 L10,226.626 L10,212.8965 A4,4 0 0 1 14,208.8965" fill="#ECEFF4" style="stroke:#9AA3B2;stroke-width:1.5;"/><rect fill="none" height="150.7861" rx="4" ry="4" style="stroke:#9AA3B2;stroke-width:1.5;" width="709.7581" x="10" y="208.8965"/><text fill="#1D2330" font-family="Helvetica" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="15.8311" x="25" y="222.4902">alt</text><text fill="#1D2330" font-family="Helvetica" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="198.2881" x="85.8311" y="223.4902">[Accept: application/xtxp+xml]</text><g class="message" data-participant-1="gw" data-participant-2="node"><polygon fill="#5C6577" points="649.7363,243.875,659.7363,247.875,649.7363,251.875,653.7363,247.875" style="stroke:#5C6577;stroke-width:1;"/><line style="stroke:#5C6577;stroke-width:1.2;" x1="394.7388" x2="655.7363" y1="247.875" y2="247.875"/><text fill="#5C6577" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="106.3652" x="401.7388" y="242.9805">open patch stream</text></g><g class="message" data-participant-1="gw" data-participant-2="c"><polygon fill="#5C6577" points="55.6528,272.3945,45.6528,276.3945,55.6528,280.3945,51.6528,276.3945" style="stroke:#5C6577;stroke-width:1;"/><line style="stroke:#5C6577;stroke-width:1.2;stroke-dasharray:2,2;" x1="49.6528" x2="393.7388" y1="276.3945" y2="276.3945"/><text fill="#5C6577" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="133.9688" x="61.6528" y="271.5">raw XTXP patch stream</text></g><line style="stroke:#9AA3B2;stroke-width:1;stroke-dasharray:2,2;" x1="10" x2="719.7581" y1="285.3945" y2="285.3945"/><text fill="#1D2330" font-family="Helvetica" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="121.0181" x="15" y="297.9883">[Accept: text/html]</text><g class="message" data-participant-1="gw" data-participant-2="c"><polygon fill="#5C6577" points="55.6528,347.6826,45.6528,351.6826,55.6528,355.6826,51.6528,351.6826" style="stroke:#5C6577;stroke-width:1;"/><line style="stroke:#5C6577;stroke-width:1.2;stroke-dasharray:2,2;" x1="49.6528" x2="393.7388" y1="351.6826" y2="351.6826"/><text fill="#5C6577" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="181.5879" x="61.6528" y="317.749">rendered current state as HTML</text><text fill="#5C6577" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="135.9199" x="61.6528" y="332.2686">+ forms that POST edits</text><text fill="#5C6577" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="326.0859" x="61.6528" y="346.7881">+ link "open in native client" &#8594; xtxp://{host}/{path}@{ref}</text></g><path d="M241,375.6826 L241,424.6826 A4,4 0 0 0 245,428.6826 L543,428.6826 A4,4 0 0 0 547,424.6826 L547,381.6826 L537,371.6826 L245,371.6826 A4,4 0 0 0 241,375.6826" fill="#FFFBEA" style="stroke:#9AA3B2;stroke-width:0.5;"/><path d="M537,371.6826 L537,379.6826 A2,2 0 0 0 539,381.6826 L547,381.6826 L537,371.6826" fill="#FFFBEA" style="stroke:#9AA3B2;stroke-width:0.5;"/><text fill="#1D2330" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="285.0098" x="247" y="389.2764">A server cannot tell whether an xtxp:// handler</text><text fill="#1D2330" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="265.5605" x="247" y="405.0059">is installed, and a meta refresh to a missing</text><text fill="#1D2330" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="278.0083" x="247" y="420.7354">handler fails silently, so the hand-off is a link.</text><path d="M10,442.8711 L10,491.8711 A4,4 0 0 0 14,495.8711 L690,495.8711 A4,4 0 0 0 694,491.8711 L694,448.8711 L684,438.8711 L14,438.8711 A4,4 0 0 0 10,442.8711" fill="#FFFBEA" style="stroke:#9AA3B2;stroke-width:0.5;"/><path d="M684,438.8711 L684,446.8711 A2,2 0 0 0 686,448.8711 L694,448.8711 L684,438.8711" fill="#FFFBEA" style="stroke:#9AA3B2;stroke-width:0.5;"/><text fill="#1D2330" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="339.3901" x="145.7855" y="456.4648">{ref} is @live (an ordinary website as it is now), @main,</text><text fill="#1D2330" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="404.187" x="145.7855" y="472.1943">a branch name, or a state vector. The last @ always starts the ref;</text><text fill="#1D2330" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="235.9487" x="145.7855" y="487.9238">a bare URL redirects to the default ref.</text></g></svg>