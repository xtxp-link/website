ize="13" lengthAdjust="spacing" textLength="3.6563" x="196" y="101.4121">&#160;</text><text fill="#1C1C1F" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="152.4009" x="196" y="117.1416">3 CLI peers + a headless</text><text fill="#1C1C1F" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="174.3955" x="196" y="132.8711">MUPPET host, all on Xmesh,</text><text fill="#1C1C1F" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="166.499" x="196" y="148.6006">over WebSocket, replaying</text><text fill="#1C1C1F" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="197.9517" x="196" y="164.3301">vectors with forced disconnects</text></g><!--entity m2--><g class="entity" data-entity="m2" data-source-line="8" data-uid="ent0004" id="entity_m2"><rect fill="#F6F6F7" height="114.377" rx="4" ry="4" width="173.8672" x="465" y="55.3594"/><text fill="#1C1C1F" font-family="Helvetica" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="20.2998" x="475" y="77.9531">M2</text><text fill="#1C1C1F" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="108.564" x="475" y="93.6826">Inkscape + no-JS</text><text fill="#1C1C1F" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="3.6563" x="475" y="109.4121">&#160;</text><text fill="#1C1C1F" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="153.8672" x="475" y="125.1416">Inkscape fork MUPPET +</text><text fill="#1C1C1F" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="146.0977" x="475" y="140.8711">server MUPPET serving</text><text fill="#1C1C1F" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="70.04" x="475" y="156.6006">plain HTML</text></g><!--entity m3--><g class="entity" data-entity="m3" data-source-line="9" data-uid="ent0005" id="entity_m3"><rect fill="#F6F6F7" height="98.6475" rx="4" ry="4" width="129.7065" x="700" y="62.8594"/><text fill="#1C1C1F" font-family="Helvetica" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="20.5029" x="710" y="85.4531">M3</text><text fill="#1C1C1F" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="109.7065" x="710" y="101.1826">Inkscape + Wasm</text><text fill="#1C1C1F" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="3.6563" x="710" y="116.9121">&#160;</text><text fill="#1C1C1F" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="108.5068" x="710" y="132.6416">browser MUPPET</text><text fill="#1C1C1F" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="101.9624" x="710" y="148.3711">(full Wasm peer)</text></g><!--entity m4--><g class="entity" data-entity="m4" data-source-line="10" data-uid="ent0006" id="entity_m4"><rect fill="#F6F6F7" height="114.377" rx="4" ry="4" width="179.999" x="901.5" y="55.3594"/><text fill="#1C1C1F" font-family="Helvetica" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="20.9028" x="911.5" y="77.9531">M4</text><text fill="#1C1C1F" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="159.999" x="911.5" y="93.6826">Inkscape + Conversations</text><text fill="#1C1C1F" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="3.6563" x="911.5" y="109.4121">&#160;</text><text fill="#1C1C1F" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="135.478" x="911.5" y="125.1416">mobile and chat users</text><text fill="#1C1C1F" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="124.9727" x="911.5" y="140.8711">via the XMPP bridge</text><text fill="#1C1C1F" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="153.1563" x="911.5" y="156.6006">(scope: open question 7)</text></g><!--entity disco--><g class="entity" data-entity="disco" data-source-line="12" data-uid="ent0007" id="entity_disco"><rect fill="#F6F6F7