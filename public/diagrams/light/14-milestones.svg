ca" font-size="13" lengthAdjust="spacing" textLength="3.6563" x="196" y="101.4121">&#160;</text><text fill="#1C1C1F" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="112.9058" x="196" y="117.1416">CLI peers + a Rust</text><text fill="#1C1C1F" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="133.396" x="196" y="132.8711">tracker, all on Xmesh,</text><text fill="#1C1C1F" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="166.499" x="196" y="148.6006">over WebSocket, replaying</text><text fill="#1C1C1F" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="197.9517" x="196" y="164.3301">vectors with forced disconnects</text></g><!--entity m2--><g class="entity" data-entity="m2" data-source-line="8" data-uid="ent0004" id="entity_m2"><rect fill="#F6F6F7" height="114.377" rx="4" ry="4" width="173.8672" x="533" y="147.3594"/><text fill="#1C1C1F" font-family="Helvetica" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="20.2998" x="543" y="169.9531">M2</text><text fill="#1C1C1F" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="108.564" x="543" y="185.6826">Inkscape + no-JS</text><text fill="#1C1C1F" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="3.6563" x="543" y="201.4121">&#160;</text><text fill="#1C1C1F" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="153.8672" x="543" y="217.1416">Inkscape fork MUPPET +</text><text fill="#1C1C1F" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="146.0977" x="543" y="232.8711">server MUPPET serving</text><text fill="#1C1C1F" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="70.04" x="543" y="248.6006">plain HTML</text></g><!--entity m3--><g class="entity" data-entity="m3" data-source-line="9" data-uid="ent0005" id="entity_m3"><rect fill="#F6F6F7" height="98.6475" rx="4" ry="4" width="129.7065" x="768" y="