ight="10" width="15" x="223.855" y="283.8594"/><rect fill="#FDEBE7" height="2" width="4" x="221.855" y="285.8594"/><rect fill="#FDEBE7" height="2" width="4" x="221.855" y="289.8594"/><text fill="#1C1C1F" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="99.855" x="119" y="311.4531">drawing@studio</text></g><!--entity ia--><g class="entity" data-entity="ia" data-source-line="10" data-uid="ent0006" id="entity_ia"><rect fill="#FDEBE7" height="61.459" rx="4" ry="4" width="108.0596" x="175" y="101.3594"/><rect fill="#FDEBE7" height="10" width="15" x="263.0596" y="106.3594"/><rect fill="#FDEBE7" height="2" width="4" x="261.0596" y="108.3594"/><rect fill="#FDEBE7" height="2" width="4" x="261.0596" y="112.3594"/><text fill="#1C1C1F" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="68.0596" x="190" y="133.9531">Inkscape A</text><text fill="#1C1C1F" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="56.3101" x="190" y="149.6826">(muppet)</text></g><!--entity ib--><g class="entity" data-entity="ib" data-source-line="11" data-uid="ent0007" id="entity_ib"><rect fill="#FDEBE7" height="61.459" rx="4" ry="4" width="107.5962" x="32" y="101.3594"/><rect fill="#FDEBE7" height="10" width="15" x="119.5962" y="106.3594"/><rect fill="#FDEBE7" height="2" width="4" x="117.5962" y="108.3594"/><rect fill="#FDEBE7" height="2" width="4" x="117.5962" y="112.3594"/><text fill="#1C1C1F" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="67.5962" x="47" y="133.9531">Inkscape B</text><text fill="#1C1C1F" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="56.3101" x="47" y="149.6826">(muppet)</text></g><!--entity sketch--><g class="entity" data-entity="sketch" data-source-line="15" data-uid="ent0009" id="entity_sketch"><rect fill="#FDEBE7" height="77.1885" rx="4" ry="4" width="164.9346" x="355.5" y="263.3594"/><rect fill="#FDEBE7" height="10" width="15" x="500.4346" y="268.3594"/><rect fill="#FDEBE7" height="2" width="4" x="498.4346" y="270.3594"/><rect fill="#FDEBE7" height="2" width="4" x="498.4346" y="274.3594"/><text fill="#1C1C1F" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="103.0923" x="370.5" y="295.9531">drawing@sketch</text><text fill="#1C1C1F" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="118.041" x="370.5" y="311.6826">(paused: automatic</text><text fill="#1C1C1F" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="124.9346" x="370.5" y="327.4121">merge into main off)</text></g><g class="entity" data-entity="GMN15" data-source-line="25" data-uid="ent0016" id="entity_GMN15"><path d="M176.5,585.3594 L176.5,681.7363 A4,4 0 0 0 180.5,685.7363 L433.4795,685.7363 A4,4 0 0 0 437.4795,681.7363 L437.4795,591.3594 L427.4795,581.3594 L311,581.3594 L307,518.5094 L303,581.3594 L180.5,581.3594 A4,4 0 0 0 176.5,585.3594" fill="#FFFBEA" style="stroke:#9A9AA1;stroke-width:0.5;"/><path d="M427.4795,581.3594 L427.4795,589.3594 A2,2 0 0 0 429.4795,591.3594 L437.4795,591.3594 L427.4795,581.3594" fill="#FFFBEA" style="stroke:#9A9AA1;stroke-width:0.5;"/><text fill="#1C1C1F" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="239.9795" x="182.5" y="598.9531">Each session lives on exactly one host,</text><text fill="#1C1C1F" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="218.4609" x="182.5" y="614.6826">and only that host admits edits to it.</text><text fill="#1C1C1F" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="238.7354" x="182.5" y="630.4121">Trust between sessions decides which</text><text fill="#1C1C1F" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="198.9165" x="182.5" y="646.1416">changes merge in automatically.</text><text fill="#1C1C1F" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="219.0322" x="182.5" y="661.8711">Merges commute, so two-way trust</text><text fill="#1C1C1F" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="131.0981" x="182.5" y="677.6006">can't loop or diverge.</text></g><!--link ia to studio--><g class="link" data-entity-1="ia" data-entity-2="studio" data-source-line="18" data-uid="lnk10" id="link_ia_studio"><path d="M219.29,162.5094 C208.41,195.7594 192.8669,243.2272 183.1069,273.0372" fill="none" id="ia-to-studio" style="stroke:#5C5C63;stroke-width:1.2;"/><polygon fill="#5C5C63" points="181.24,278.7394,187.8418,271.4308,182.7958,273.9876,180.239,268.9415,181.24,278.7394" style="stroke:#5C5C63;stroke-width:1.2;"/><text fill="#5C5C63" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="27.5098" x="209" y="204.9844">edits</text></g><!--link ib to studio--><g class="link" data-entity-1="ib" data-entity-2="studio" data-source-line="19" data-uid="lnk11" id="link_ib_studio"><path d="M101.53,162.5094 C118.95,195.7594 144.0166,243.614 159.6266,273.424" fill="none" id="ib-to-studio" style="stroke:#5C5C63;stroke-width:1.2;"/><polygon fill="#5C5C63" points="162.41,278.7394,161.7785,268.9108,160.0905,274.3099,154.6914,272.622,162.41,278.7394" style="stroke:#5C5C63;stroke-width:1.2;"/><text fill="#5C5C63" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="27.5098" x="125" y="204.9844">edits</text></g><!--link studio to main--><g class="link" data-entity-1="studio" data-entity-2="main" data-source-line="20" data-uid="lnk12" id="link_studio_main"><path d="M171.9649,330.9151 C171.0449,355.4151 173.11,389.1994 191,417.3594 C206.3,441.4294 226.8633,456.8135 250.2733,469.4835" fill="none" id="studio-main" style="stroke:#5C5C63;stroke-width:1.2;"/><polygon fill="#5C5C63" points="172.19,324.9194,167.8551,333.7629,172.0024,329.9159,175.8495,334.0631,172.19,324.9194" style="stroke:#5C5C63;stroke-width:1.2;"/><polygon fill="#5C5C63" points="255.55,472.3394,249.5388,464.5377,251.1527,469.9595,245.731,471.5734,255.55,472.3394" style="stroke:#5C5C63;stroke-width:1.2;"/><text fill="#5C5C63" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="91.207" x="192" y="384.9844">trust both ways:</text><text fill="#5C5C63" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="88.2246" x="193.4912" y="399.5039">changes merge</text><text fill="#5C5C63" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="75.1875" x="200.0098" y="414.0234">automatically</text></g><!--reverse link sketch to main--><g class="link" data-entity-1="sketch" data-entity-2="main" data-source-line="21" data-uid="lnk13" id="link_sketch_main"><path d="M350.0458,330.9868 C329.7658,341.3368 315.84,352.8794 304,372.3594 C285.4,402.9594 292.67,446.3194 299.75,472.2694" fill="none" id="sketch-backto-main" style="stroke:#5C5C63;stroke-width:1.2;stroke-dasharray:7,7;"/><polygon fill="#5C5C63" points="355.39,328.2594,345.5553,328.7877,350.9365,330.5323,349.1919,335.9134,355.39,328.2594" style="stroke:#5C5C63;stroke-width:1.2;"/><text fill="#5C5C63" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="107.3789" x="305" y="391.9844">sketch trusts main:</text><text fill="#5C5C63" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="74.4492" x="321.4648" y="406.5039">stays current</text></g><!--link sketch to main--><g class="link" data-entity-1="sketch" data-entity-2="main" data-source-line="22" data-uid="lnk14" id="link_sketch_main"><path d="M438.21,340.5594 C436.7,364.2694 431.63,394.5694 417,417.3594 C401.82,440.9994 381.7636,456.4523 359.2736,469.3623" fill="none" id="sketch-to-main" style="stroke:#5C5C63;stroke-width:1.2;stroke-dasharray:7,7;"/><polygon fill="#5C5C63" points="354.07,472.3494,363.8668,471.3379,358.4063,469.8602,359.8841,464.3997,354.07,472.3494" style="stroke:#5C5C63;stroke-width:1.2;"/><text fill="#5C5C63" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="62.6016" x="459.084" y="384.9844">on release:</text><text fill="#5C5C63" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="103.9219" x="438.4238" y="399.5039">main trusts sketch</text><text fill="#5C5C63" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="112.7695" x="434" y="414.0234">(an ordinary merge)</text></g></g></svg>