" height="2" width="4" x="694.3447" y="414.3594"/><rect fill="#FDEBE7" height="2" width="4" x="694.3447" y="418.3594"/><text fill="#1C1C1F" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="61.5786" x="569" y="439.9531">Edge host</text><text fill="#1C1C1F" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="122.3447" x="569" y="455.6826">(headless MUPPET)</text></g><!--entity w--><g class="entity" data-entity="w" data-source-line="13" data-uid="ent0009" id="entity_w"><rect fill="#FDEBE7" height="61.459" rx="4" ry="4" width="145.7266" x="562" y="247.3594"/><rect fill="#FDEBE7" height="10" width="15" x="687.7266" y="252.3594"/><rect fill="#FDEBE7" height="2" width="4" x="685.7266" y="254.3594"/><rect fill="#FDEBE7" height="2" width="4" x="685.7266" y="258.3594"/><text fill="#1C1C1F" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="51.1685" x="577" y="279.9531">Browser</text><text fill="#1C1C1F" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="105.7266" x="577" y="295.6826">(Wasm MUPPET)</text></g><!--entity mt--><g class="entity" data-entity="mt" data-source-line="17" data-uid="ent0011" id="entity_mt"><rect fill="#FDEBE7" height="61.459" rx="4" ry="4" width="162.3447" x="429" y="594.3594"/><rect fill="#FDEBE7" height="10" width="15" x="571.3447" y="599.3594"/><rect fill="#FDEBE7" height="2" width="4" x="569.3447" y="601.3594"/><rect fill="#FDEBE7" height="2" width="4" x="569.3447" y="605.3594"/><text fill="#1C1C1F" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="60.125" x="444" y="626.9531">Main host</text><text fill="#1C1C1F" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="122.3447" x="444" y="642.6826">(headless MUPPET)</text></g><!--entity st--><g class="entity" data-entity="st" data-source-line="18" data-uid="ent0012" id="entity_st"><path d="M453,740.3594 C453,730.3594 509.9028,730.3594 509.9028,730.3594 C509.9028,730.3594 566.8057,730.3594 566.8057,740.3594 L566.8057,765.0889 C566.8057,775.0889 509.9028,775.0889 509.9028,775.0889 C509.9028,775.0889 453,775.0889 453,765.0889 L453,740.3594" fill="#ECECEE"/><path d="M453,740.3594 C453,750.3594 509.9028,750.3594 509.9028,750.3594 C509.9028,750.3594 566.8057,750.3594 566.8057,740.3594" fill="none"/><text fill="#1C1C1F" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="93.8057" x="463" y="766.9531">Branch storage</text></g><g class="entity" data-entity="GMN21" data-source-line="31" data-uid="ent0022" id="entity_GMN21"><path d="M626,584.3594 L626,620.8594 L591.02,624.8594 L626,628.8594 L626,665.0068 A4,4 0 0 0 630,669.0068 L878.2251,669.0068 A4,4 0 0 0 882.2251,665.0068 L882.2251,590.3594 L872.2251,580.3594 L630,580.3594 A4,4 0 0 0 626,584.3594" fill="#FFFBEA" style="stroke:#9A9AA1;stroke-width:0.5;"/><path d="M872.2251,580.3594 L872.2251,588.3594 A2,2 0 0 0 874.2251,590.3594 L882.2251,590.3594 L872.2251,580.3594" fill="#FFFBEA" style="stroke:#9A9AA1;stroke-width:0.5;"/><text fill="#1C1C1F" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="200.6812" x="632" y="597.9531">Each host admits edits in its own</text><text fill="#1C1C1F" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="227.7793" x="632" y="613.6826">arrival order. An edit admitted by any</text><text fill="#1C1C1F" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="206.3623" x="632" y="629.4121">host holding a `host` grant counts</text><text fill="#1C1C1F" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="235.2251" x="632" y="645.1416">everywhere. A revocation closes each</text><text fill="#1C1C1F" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="166.1182" x="632" y="660.8711">host's door as it reaches it.</text></g><!--link a to lt--><g class="link" data-entity-1="a" data-entity-2="lt" data-source-line="21" data-uid="lnk13" id="link_a